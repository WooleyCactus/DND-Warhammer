<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>GM Command Center · Rogue Trader Manifest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Cinzel:wght@500;700&family=Share+Tech+Mono&display=swap">
<style>
:root{
 --bg:#0D0C0A;--plate:#1B1815;--plate-hi:#25201B;--sunk:#0A0908;--ink:#E8DEC6;--muted:#A0957D;--line:#3B3229;
 --gold:#C8A24A;--gold-hi:#EBCB7A;--gold-dk:#7A5C1E;--blood:#B3262A;--blood-dk:#5E0F12;--warp:#8E5BC4;--ok:#7FA36A;--warn:#D08A2E;
 --f-display:'Cinzel',Georgia,serif;--f-body:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
 color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
header{position:sticky;top:0;z-index:6;display:flex;gap:10px;align-items:center;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(180deg,#221d18,var(--plate));border-bottom:1px solid var(--gold-dk);flex-wrap:wrap}
h1{font:700 15px var(--f-display);letter-spacing:.08em;color:var(--gold-hi);margin:0;white-space:nowrap}
header .sp{flex:1}
header a{color:var(--gold-hi);font-size:14px}
.code{font:13px var(--f-mono);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.dot.live{background:var(--ok);box-shadow:0 0 6px var(--ok)}.dot.off{background:var(--blood)}
#save{font:12px var(--f-mono);color:var(--muted)}
.cmd{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;background:#15120f;border-bottom:1px solid var(--line)}
.cmd .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cmd .lbl{font:700 11px var(--f-display);letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.cc{display:grid;gap:12px;padding:12px;align-items:start;grid-template-columns:300px minmax(0,1fr) 350px;grid-template-areas:"L C R"}
.colL{grid-area:L}.colC{grid-area:C}.colR{grid-area:R}
.colL,.colC,.colR{display:flex;flex-direction:column;gap:12px;min-width:0}
.cc.bigmap{grid-template-columns:minmax(0,1fr) 350px;grid-template-areas:"C C" "L R"}
@media (max-width:1180px){.cc{grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"L R" "C R"}.cc.bigmap{grid-template-areas:"C C" "L R"}
 #pParty .pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}}
@media (max-width:760px){.cc,.cc.bigmap{grid-template-columns:minmax(0,1fr);grid-template-areas:"L" "C" "R";padding:10px}}
section.box{background:var(--plate);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
h2{font:700 12px var(--f-display);letter-spacing:.12em;color:var(--gold);margin:0;text-transform:uppercase;display:flex;align-items:center;gap:8px}
h2 .sp{flex:1}
h2 .n{font:12px var(--f-mono);color:var(--muted);letter-spacing:0;text-transform:none}
.mapbox iframe{width:100%;height:clamp(420px,64vh,820px);border:1px solid var(--line);background:#08070a;display:block}
.cc.bigmap .mapbox iframe{height:clamp(480px,78vh,1000px)}
@media (max-width:760px){.mapbox iframe{height:72vh}}
select,input,textarea,button{font:inherit;color:var(--ink)}
select,input,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:2px;padding:6px 8px;min-width:0}
textarea{width:100%;min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:1px solid var(--gold);border-color:var(--gold)}
button{background:var(--plate-hi);border:1px solid var(--line);border-radius:2px;padding:6px 10px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--gold-dk)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#140F06;border-color:var(--gold-dk);font-weight:700}
button.bad{border-color:var(--blood-dk);color:#f0b8b8}
button.sm{padding:3px 8px;font-size:13px}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.on{border-color:var(--gold);background:#3a2f1c;color:var(--gold-hi)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:110px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px}
label:not(.ck)>input,label>select,label>textarea{width:100%}
label.ck input{width:18px;height:18px;flex:none}
.muted{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-style:italic;font-size:14px;margin:0}
.tag{font:11px var(--f-mono);border:1px solid var(--line);padding:1px 6px;color:var(--muted);white-space:nowrap}
.tag.main{color:var(--gold-hi);border-color:var(--gold-dk)}.tag.ok{color:var(--ok);border-color:#3c5a2c}.tag.bad{color:#f08080;border-color:var(--blood-dk)}
.bar{height:6px;background:#2a241e;position:relative;flex:0 0 70px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.hpbar{height:7px;background:#2a241e;position:relative}
.hpbar i{position:absolute;inset:0 auto 0 0}
.pc{background:var(--sunk);border:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.pc:hover{border-color:var(--gold-dk)}
.pc .top{display:flex;gap:8px;align-items:baseline}
.pc .top b{font:700 15px var(--f-display);color:var(--gold-hi);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:flex;gap:10px;flex-wrap:wrap;font:12px var(--f-mono);color:var(--muted)}
.stats b{color:var(--ink);font-weight:400}
.li{display:flex;gap:8px;align-items:center;padding:6px 8px;background:var(--sunk);border:1px solid var(--line);cursor:pointer;min-width:0}
.li:hover{border-color:var(--gold-dk)}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .sub{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lst{display:flex;flex-direction:column;gap:5px}
.ck-row{display:flex;gap:6px;align-items:center}
.ck-row input[type=text]{flex:1;min-width:0}
.ck-row input[type=checkbox]{width:18px;height:18px;flex:none}
.ck-row.done input[type=text]{color:var(--muted);text-decoration:line-through}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pips button{width:18px;height:18px;padding:0;border-radius:50%}
.pips button.f{background:var(--blood);border-color:var(--blood)}
.ab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:560px){.ab{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ans{display:flex;gap:8px;align-items:baseline;font-size:14px}
.ans .who{min-width:90px;color:var(--muted)}
details>summary{cursor:pointer;color:var(--muted);font-size:13px}
#drawer{position:fixed;inset:0;z-index:20;background:rgba(5,4,3,.55);display:flex;justify-content:flex-end}
#drawer .dp{width:min(560px,100%);height:100%;background:var(--plate);border-left:1px solid var(--gold-dk);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.6)}
#drawer .dh{display:flex;align-items:center;gap:8px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
#drawer .dh b{font:700 15px var(--f-display);color:var(--gold-hi);flex:1}
#drawer .db{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:max(30px,env(safe-area-inset-bottom))}
#lock{position:fixed;inset:0;background:rgba(8,7,10,.96);display:grid;place-items:center;padding:20px;z-index:30}
#lock .box{background:var(--plate);border:1px solid var(--gold-dk);padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
#lock h3{font:700 18px var(--f-display);color:var(--gold-hi);margin:0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2b1214;border:1px solid var(--blood);padding:8px 14px;max-width:90%;z-index:40}
#toast.ok{background:#16200f;border-color:var(--ok)}
</style>
</head>
<body>
<header id="hdr">
 <h1>☩ GM Command Center</h1><span class="dot" id="dot"></span><span class="code" id="codeLbl"></span><span id="save"></span>
 <span class="sp"></span><a href="./">Sheets</a><button class="sm ghost" id="lockBtn" title="Lock this device">Lock</button>
</header>
<div class="cmd" id="cmd"></div>
<div class="cc" id="cc">
 <div class="colL"><section class="box" id="pParty"></section></div>
 <div class="colC">
  <section class="box mapbox"><h2>Battle map<span class="sp"></span><button class="sm" data-act="bigmap" id="bigBtn">⤢ Bigger</button><a href="map.html" target="_blank" rel="noopener" style="text-transform:none;letter-spacing:0;font-family:var(--f-body);color:var(--gold-hi)">Full screen ↗</a></h2>
   <iframe id="mapf" title="Battle map" loading="eager"></iframe></section>
  <section class="box" id="pSession"></section>
 </div>
 <div class="colR"><section class="box" id="pGoals"></section><section class="box" id="pStory"></section><section class="box" id="pPolls"></section><section class="box" id="pNpcs"></section><section class="box" id="pClocks"></section></div>
</div>
<div id="drawer" hidden><div class="dp"><div class="dh"><b id="dTitle"></b><button class="ghost" data-act="dclose" aria-label="Close">✕</button></div><div class="db" id="dBody"></div></div></div>
<div id="lock" hidden><div class="box">
 <h3>GM Command Center</h3>
 <p class="muted" style="margin:0">Story notes, NPCs, overrides and polls need the GM PIN. It's the same PIN as the battle map. If this party has no PIN yet, the one you enter becomes it.</p>
 <label>Party code<input id="lCode" placeholder="VOID-7K3Q" autocomplete="off" autocapitalize="characters"></label>
 <label>GM PIN<input id="lPin" type="password" autocomplete="off"></label>
 <button class="pri" id="lGo">Unlock</button>
 <p class="muted" id="lErr" style="margin:0;color:#f08080"></p>
</div></div>
<div id="toast" hidden></div>
<script src="mapgen.js"></script>
<script>
const SUPA_URL='https://xpljuyatduvrbhiwfbwn.supabase.co',SUPA_KEY='sb_publishable_zU8au39xaYFxmL3cZH09gQ_w95iJkD5',
 SUPA_LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{v==null||v===''?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}};
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^(.{4})(.+)$/,'$1-$2').slice(0,9);
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const ABIL=['str','dex','con','int','wis','cha'];
const KINDS={main:'Main arc',thread:'Side thread',quest:'Quest',player:'Player-started'};
const STATUS={active:'Active',paused:'On hold',done:'Resolved',failed:'Failed'};
const ATT=[['-2','Hostile'],['-1','Wary'],['0','Neutral'],['1','Friendly'],['2','Allied']];
const NPCSTAT={alive:'Alive',dead:'Dead',missing:'Missing',unknown:'Unknown'};
const CONDS=['Prone','Grappled','Restrained','Stunned','Frightened','Poisoned','Blinded','Unconscious','Concentrating','Dodging'];
const NPC_COLORS=['#B3262A','#7E2B2B','#5E7A2E','#6B4A9E','#555048','#2E5E7A'];

const G={code:'',pin:'',client:null,data:null,chars:[],claims:[],map:null,polls:[],drawer:null,edit:null,pollDraft:{to:[]},npcq:'',status:'connecting',gen:null};

/* ---------- connection ---------- */
function loadScript(src){return new Promise((ok,no)=>{if(window.supabase)return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function rpc(fn,args){const{data,error}=await G.client.rpc(fn,args);if(error)throw error;return data;}
function blank(){return{v:1,story:{arcs:[],goals:[],clocks:[]},npcs:[],factions:[],sessions:[],notes:'',pcNotes:{},seen:{}};}
function norm(d){const b=blank();d=Object.assign(b,d||{});d.story=Object.assign(blank().story,d.story||{});d.pcNotes=d.pcNotes||{};d.seen=d.seen||{};return d;}
async function unlock(code,pin){
 $('#lErr').textContent='';
 try{await loadScript(SUPA_LIB);}catch(e){$('#lErr').textContent='Couldn’t reach the server. Check your connection.';return;}
 G.client=G.client||window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false}});
 try{const ok=await rpc('map_claim_gm',{p_party:code,p_pin:pin});if(!ok){$('#lErr').textContent='That PIN doesn’t match this party.';return;}}
 catch(e){$('#lErr').textContent=e.message||'Couldn’t check the PIN.';return;}
 G.code=code;G.pin=pin;lsSet('rtm.party.code',code);lsSet('rtm.map.pin.'+code,pin);lsSet('rtm.map.role.'+code,'gm');
 $('#lock').hidden=true;$('#codeLbl').textContent=code;
 if(!$('#mapf').src)$('#mapf').src='map.html?embed=1';
 subscribe();await loadAll();
}
function subscribe(){
 const room=G.code.replace('-','');
 G.pchan=G.client.channel('party-'+room,{config:{broadcast:{self:false}}}).on('broadcast',{event:'changed'},()=>loadChars()).subscribe(st=>setStatus(st));
 G.mchan=G.client.channel('map-'+room,{config:{broadcast:{self:false}}}).on('broadcast',{event:'meta'},()=>loadMapSoon()).on('broadcast',{event:'reload'},()=>loadMapSoon())
  .on('broadcast',{event:'tok'},()=>loadMapSoon()).on('broadcast',{event:'del'},()=>loadMapSoon()).on('broadcast',{event:'hid'},()=>loadMapSoon()).subscribe();
 G.qchan=G.client.channel('polls-'+room,{config:{broadcast:{self:false}}}).on('broadcast',{event:'answered'},()=>loadPolls()).subscribe();
 setInterval(()=>{if(document.visibilityState==='visible'){loadChars();loadMap();loadPolls();}},25000);
}
function setStatus(st){G.status=st==='SUBSCRIBED'?'live':st==='CHANNEL_ERROR'||st==='TIMED_OUT'?'off':'connecting';$('#dot').className='dot '+(G.status==='live'?'live':G.status==='off'?'off':'');}
async function loadAll(){await Promise.all([loadData(),loadChars(),loadMap(),loadPolls()]);render();}
async function loadData(){try{const r=await rpc('gm_get',{p_party:G.code,p_pin:G.pin});G.data=norm(r.data);}catch(e){toast(e.message);if(/PIN/.test(e.message||''))relock();}}
async function loadChars(){try{G.chars=(await rpc('party_list',{p_party:G.code}))||[];try{G.claims=(await rpc('char_claims',{p_party:G.code}))||[];}catch(e){}render();}catch(e){}}
async function loadMap(){try{G.map=await rpc('map_get',{p_party:G.code,p_pin:G.pin});render();}catch(e){}}
let mapT=0;function loadMapSoon(){clearTimeout(mapT);mapT=setTimeout(loadMap,700);}
async function loadPolls(){try{G.polls=(await rpc('poll_list',{p_party:G.code,p_pin:G.pin}))||[];render();}catch(e){}}
function relock(){$('#lock').hidden=false;$('#lCode').value=G.code||normCode(lsGet('rtm.party.code'));$('#lPin').value='';}

/* ---------- saving the GM notes ---------- */
let saveT=0,saving=false,again=false;
function dirty(){$('#save').textContent='Unsaved…';clearTimeout(saveT);saveT=setTimeout(save,700);}
async function save(){
 if(saving){again=true;return;}saving=true;$('#save').textContent='Saving…';
 try{await rpc('gm_save',{p_party:G.code,p_pin:G.pin,p_data:G.data});$('#save').textContent='Saved';}
 catch(e){$('#save').textContent='Not saved';toast('Couldn’t save: '+(e.message||'unknown error'));}
 saving=false;if(again){again=false;save();}
}
window.addEventListener('beforeunload',e=>{if($('#save').textContent==='Unsaved…'||saving){save();e.preventDefault();e.returnValue='';}});

/* ---------- helpers ---------- */
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setPath(o,p,v){const ks=p.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k]=a[k]||{},o);t[last]=v;}
const mod=v=>Math.floor(((+v||10)-10)/2);
const sgn=n=>(n>=0?'+':'')+n;
function charInfo(r){const d=r.data||{},src=d.src||{},st=d.state||{};const lvl=(src.classes||[]).reduce((a,c)=>a+(+c.level||0),0)||1;const pb=2+Math.floor((lvl-1)/4);
 const per=(src.skills||{}).perception||0;const max=+src.maxHp||0;
 return{id:r.id,name:src.name||'Unnamed',player:src.player||'',cls:(src.classes||[]).map(c=>(c.cls||'?').replace(/^./,x=>x.toUpperCase())+' '+(c.level||1)).join(' / '),
  hp:st.hp==null?max:+st.hp,max,temp:+st.temp||0,ac:src.ac,speed:+src.speed||30,pp:10+mod((src.abilities||{}).wis)+pb*per,
  corruption:+st.corruption||0,insanity:+st.insanity||0,abil:src.abilities||{}};}
const tokenFor=id=>(G.map&&G.map.tokens&&G.map.tokens['pc-'+id])||null;
const charName=id=>{const r=G.chars.find(x=>x.id===id);return r?charInfo(r).name:'(removed character)';};
let toastT=0;function toast(m,ok){const t=$('#toast');t.textContent=m;t.className=ok?'ok':'';t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200);}

/* ---------- render: each panel separately so typing and the map iframe are never disturbed ---------- */
const pend=new Set();
function paint(sel,html){const el=$(sel);if(!el)return;const a=document.activeElement;if(a&&el.contains(a)&&a.matches('input,textarea,select')){pend.add(sel);return;}if(el._h!==html){el.innerHTML=html;el._h=html;}}
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;[...pend].forEach(sel=>{const el=$(sel);if(!(a&&el&&el.contains(a)&&a.matches('input,textarea,select'))){pend.delete(sel);render();}});},0));
let rT=0;function render(){if(rT)return;rT=requestAnimationFrame(()=>{rT=0;if(!G.data)return;
 paint('#cmd',vCmd());paint('#pParty',vParty());paint('#pSession',vSession());paint('#pGoals',vGoals());paint('#pStory',vStory());paint('#pPolls',vPolls());paint('#pNpcs',vNpcs());paint('#pClocks',vClocks());
 if(G.drawer){$('#drawer').hidden=false;$('#dTitle').textContent=drawerTitle();paint('#dBody',vDrawer());}else $('#drawer').hidden=true;});}

function vCmd(){
 const m=G.map;const meta=(m&&m.meta)||{};const has=!!meta.cells;const I=meta.init||{};const toks=(m&&m.tokens)||{};
 const curId=I.on?(I.order||[])[I.turn]:null;const cur=curId&&toks[curId];
 const nm=t=>!t?'?':t.kind==='pc'&&t.charId?charName(t.charId):t.name;
 const waiting=new Set(G.polls.filter(p=>p.answer==null).map(p=>p.id.split(':')[0])).size;
 return`<div class="grp"><span class="lbl">Map</span>${has?`<span class="tag ${meta.live===false?'bad':'ok'}">${meta.live===false?'🔒 Hidden from players':'👁 Players can see it'}</span><button class="sm ${meta.live===false?'pri':''}" data-act="maplive" data-v="${meta.live===false?1:0}">${meta.live===false?'Reveal':'Hide'}</button>`:'<span class="tag">No map yet</span>'}<button class="sm ${has?'':'pri'}" data-act="dnewmap">${has?'New map':'Generate a map'}</button></div>
 <div class="grp"><span class="lbl">Combat</span>${I.on?`<span>Round <b>${I.round}</b> · <b>${esc(nm(cur))}</b></span><button class="sm" data-act="prevturn" aria-label="Previous turn">◂</button><button class="sm pri" data-act="nextturn">Next turn ▸</button><button class="sm bad" data-act="endcombat">End</button>`:`<span class="muted">${has?'Not started. Initiative and Start combat are on the map’s Turn tab.':'—'}</span>`}</div>
 <div class="grp"><span class="lbl">Polls</span><span class="muted">${waiting?waiting+' waiting for answers':'none waiting'}</span><button class="sm" data-act="dpoll">Send a poll</button></div>`;
}
function hpBar(hp,max){const f=max?Math.max(0,Math.min(1,hp/max)):1;return`<div class="hpbar"><i style="width:${f*100}%;background:${f>.5?'var(--ok)':f>.25?'var(--warn)':'var(--blood)'}"></i></div>`;}
function mapToks(){return(G.map&&G.map.tokens)||{};}
function curTurn(){const I=G.map&&G.map.meta&&G.map.meta.init;return I&&I.on?(I.order||[])[I.turn]:null;}
function npcToken(n){return Object.values(mapToks()).find(t=>t.npcRef===n.id)||null;}
// One card for anything with HP that the GM runs: quick damage/heal, conditions, initiative.
function combatCard(t,o){const cur=curTurn()===t.id;const dead=t.maxHp&&t.hp<=0;
 return`<div class="pc" data-act="${o.act}" data-id="${esc(o.id)}" style="${cur?'border-color:var(--gold);background:#2a2216;':''}${dead?'opacity:.6;':''}">
  <div class="top"><b>${esc(o.name)}</b>${t.hidden?'<span title="Hidden from players">👁</span>':''}${cur?'<span class="tag main">Turn</span>':''}${dead?'<span class="tag bad">Down</span>':''}</div>
  ${o.sub?`<div class="muted" style="margin-top:-3px">${esc(o.sub)}</div>`:''}
  ${t.maxHp?hpBar(+t.hp||0,+t.maxHp):''}
  <div class="stats">${t.maxHp?`<span>HP <b>${t.hp??'?'}/${t.maxHp}</b></span>`:''}${t.ac!=null&&t.ac!==''?`<span>AC <b>${esc(t.ac)}</b></span>`:''}${t.init!=null&&t.init!==''?`<span>Init <b>${esc(t.init)}</b></span>`:''}${o.onMap===false?'<span>not on map</span>':''}</div>
  ${t.cond&&t.cond.length?`<div class="row">${t.cond.map(x=>`<span class="tag bad">${esc(x)}</span>`).join('')}</div>`:''}
  ${t.maxHp?`<div class="row"><input type="number" inputmode="numeric" class="qd" placeholder="amt" style="width:64px" aria-label="Amount"><button class="sm bad" data-act="${o.kind}dmg" data-id="${esc(o.id)}">− Damage</button><button class="sm" data-act="${o.kind}heal" data-id="${esc(o.id)}">+ Heal</button></div>`:''}</div>`;}
function vParty(){
 const pcs=G.chars.map(r=>{const c=charInfo(r);const t=tokenFor(c.id);const cur=t&&curTurn()===t.id;
  return`<div class="pc" data-act="dpc" data-id="${esc(c.id)}" style="${cur?'border-color:var(--gold);background:#2a2216;':''}"><div class="top"><b>${esc(c.name)}</b>${cur?'<span class="tag main">Turn</span>':''}${G.claims.includes(c.id)?'<span title="Player PIN set">🔒</span>':'<span class="tag" title="No player PIN yet">unclaimed</span>'}</div>
   <div class="muted" style="margin-top:-3px">${esc(c.player?c.player+' · ':'')}${esc(c.cls)}</div>
   ${hpBar(c.hp,c.max)}
   <div class="stats"><span>HP <b>${c.hp}/${c.max}${c.temp?' +'+c.temp:''}</b></span><span>AC <b>${esc(c.ac==null?'–':c.ac)}</b></span><span>PP <b>${c.pp}</b></span>${t&&t.init!=null&&t.init!==''?`<span>Init <b>${esc(t.init)}</b></span>`:''}${c.corruption?`<span>Corr <b style="${c.corruption>=25?'color:#ff8487':''}">${c.corruption}</b></span>`:''}${c.insanity?`<span>Ins <b>${c.insanity}</b></span>`:''}</div>
   ${t&&t.cond&&t.cond.length?`<div class="row">${t.cond.map(x=>`<span class="tag bad">${esc(x)}</span>`).join('')}</div>`:''}
   ${G.data.pcNotes[c.id]?`<div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📝 ${esc(G.data.pcNotes[c.id])}</div>`:''}</div>`;}).join('');
 const comps=G.data.npcs.filter(n=>n.companion).map(n=>{const t=npcToken(n);const st=t||n;
  return combatCard(st,{act:t?'dtok':'dnpc',id:t?t.id:n.id,name:n.name||'Unnamed',sub:[n.role,n.faction].filter(Boolean).join(' · '),kind:t?'t':'n',onMap:!!t});}).join('');
 const I=G.map&&G.map.meta&&G.map.meta.init;const order=I&&I.on?I.order||[]:[];
 const foes=Object.values(mapToks()).filter(t=>t.kind!=='pc'&&!(t.npcRef&&(G.data.npcs.find(n=>n.id===t.npcRef)||{}).companion))
  .sort((a,b)=>order.length?((order.indexOf(a.id)+1||999)-(order.indexOf(b.id)+1||999)):String(a.name).localeCompare(String(b.name),undefined,{numeric:true}));
 const foeHtml=foes.map(t=>combatCard(t,{act:'dtok',id:t.id,name:t.name||'?',kind:'t'})).join('');
 return`<h2>Party<span class="sp"></span><span class="n">${G.chars.length}</span></h2>${G.chars.length?`<div class="pcs lst">${pcs}</div>`:`<p class="empty">No characters in ${esc(G.code)} yet. Send the invite link from the Party page.</p>`}
  <h2 style="margin-top:6px">Companions<span class="sp"></span><span class="n">${G.data.npcs.filter(n=>n.companion).length}</span></h2>${comps?`<div class="pcs lst">${comps}</div>`:'<p class="empty">NPCs travelling with the party show here. Mark one as a companion in the NPC list.</p>'}
  <h2 style="margin-top:6px">On the map<span class="sp"></span><span class="n">${foes.length}</span></h2>${foeHtml?`<div class="pcs lst">${foeHtml}</div>`:`<p class="empty">${G.map&&G.map.meta&&G.map.meta.cells?'No enemies or NPCs on the map. Add them from the NPC list or the map’s GM tab.':'No battle map yet.'}</p>`}`;
}
function curSession(){return G.data.sessions[0]||null;}
function vSession(){const s=curSession();
 return`<h2>Session notes<span class="sp"></span><button class="sm" data-act="addsession">New session</button>${G.data.sessions.length>1?`<button class="sm ghost" data-act="dsessions">All (${G.data.sessions.length})</button>`:''}</h2>
  ${s?`<div class="row"><input type="date" data-k="sessions.0.date" value="${esc(s.date||'')}"><input class="grow" data-k="sessions.0.title" value="${esc(s.title||'')}" placeholder="Session title"></div>
  <textarea data-k="sessions.0.notes" style="min-height:110px" placeholder="What happened, what the players invented, loose ends">${esc(s.notes||'')}</textarea>`:'<p class="empty">Start a session to take notes as you play.</p>'}
  <details ${G.data.notes?'open':''}><summary>Scratchpad</summary><textarea data-k="notes" style="margin-top:6px" placeholder="Anything">${esc(G.data.notes||'')}</textarea></details>`;}
function vGoals(){const g=G.data.story.goals;const d=g.filter(x=>x.done).length;
 return`<h2>Tonight's goals<span class="sp"></span><span class="n">${d}/${g.length}</span>${d?'<button class="sm ghost" data-act="cleargoals">Clear done</button>':''}</h2>
  ${g.length?`<div class="lst">${g.map((x,i)=>`<div class="ck-row ${x.done?'done':''}"><input type="checkbox" data-ck="story.goals.${i}.done" ${x.done?'checked':''} aria-label="Done"><input type="text" data-k="story.goals.${i}.text" value="${esc(x.text)}"><button class="sm ghost" data-act="rm" data-p="story.goals" data-i="${i}" aria-label="Remove">✕</button></div>`).join('')}</div>`:''}
  <div class="row"><input class="grow" id="newGoal" placeholder="Add a goal"><button class="sm" data-act="addgoal">Add</button></div>`;}
function vStory(){const arcs=G.data.story.arcs;const all=arcs.reduce((a,x)=>a+x.milestones.length,0),done=arcs.reduce((a,x)=>a+x.milestones.filter(m=>m.done).length,0);
 return`<h2>Story<span class="sp"></span><span class="n">${done}/${all} milestones</span><button class="sm ghost" data-act="dimport">Import</button></h2>
  ${arcs.length?`<div class="lst">${arcs.map(a=>{const n=a.milestones.length,d=a.milestones.filter(m=>m.done).length;const next=a.milestones.find(m=>!m.done);
   return`<div class="li" data-act="darc" data-id="${a.id}"><span class="t">${esc(a.title||'Untitled')}<span class="sub">${a.status==='done'?'Resolved':a.status==='failed'?'Failed':next?'Next: '+esc(next.text):n?'All milestones done':'No milestones yet'}</span></span>${a.kind==='main'?'<span class="tag main">Main</span>':''}<span class="bar"><i style="width:${n?d/n*100:0}%"></i></span><span class="muted">${d}/${n}</span></div>`;}).join('')}</div>`:'<p class="empty">No arcs yet. Add your storyline, then break it into milestones.</p>'}
  <div class="row"><input class="grow" id="newArc" placeholder="New arc or quest"><select id="newKind" aria-label="Type">${Object.entries(KINDS).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><button class="sm" data-act="addarc">Add</button></div>`;}
function pollGroups(){const groups={};G.polls.forEach(p=>{const g=p.id.split(':')[0];(groups[g]=groups[g]||{id:g,data:p.data,at:p.created_at,rows:[]}).rows.push(p);});return Object.values(groups).sort((a,b)=>String(b.at).localeCompare(String(a.at)));}
const ansText=a=>a?((a.choice?a.choice:'')+(a.choice&&a.text?' — ':'')+(a.text||'')):'';
function groupCard(g){return`<div class="pc" style="cursor:default"><div class="row"><b style="flex:1">${esc(g.data.q)}</b><button class="sm ghost" data-act="pdel" data-g="${esc(g.id)}">Remove</button></div>
  ${g.rows.map(p=>`<div class="ans"><span class="who">${esc(charName(p.char_id))}</span>${p.answer?`<span>${esc(ansText(p.answer))}</span>`:'<span class="empty">waiting…</span>'}</div>`).join('')}</div>`;}
function vPolls(){const gs=pollGroups();
 return`<h2>Polls<span class="sp"></span><button class="sm pri" data-act="dpoll">New poll</button></h2>${gs.length?`<div class="lst">${gs.slice(0,3).map(groupCard).join('')}</div>${gs.length>3?`<button class="sm ghost" data-act="dpoll">All polls (${gs.length})</button>`:''}`:'<p class="empty">Send private questions to individual players.</p>'}`;}
function vNpcs(){const q=G.npcq.toLowerCase();const list=G.data.npcs.filter(n=>!q||[n.name,n.faction,n.where,n.role].join(' ').toLowerCase().includes(q));
 return`<h2>NPCs<span class="sp"></span><span class="n">${G.data.npcs.length}</span><button class="sm ghost" data-act="dfactions">Factions (${G.data.factions.length})</button></h2>
  ${G.data.npcs.length>5?`<input id="npcq" value="${esc(G.npcq)}" placeholder="Search NPCs">`:''}
  ${list.length?`<div class="lst">${list.slice(0,12).map(n=>{const att=ATT.find(a=>+a[0]===+n.attitude)||ATT[2];return`<div class="li" data-act="dnpc" data-id="${n.id}"><span class="t">${esc(n.name||'Unnamed')}<span class="sub">${esc([n.role,n.faction,n.where&&('seen: '+n.where)].filter(Boolean).join(' · '))}</span></span><span class="tag ${+n.attitude<0?'bad':+n.attitude>0?'ok':''}">${att[1]}</span>${n.status&&n.status!=='alive'?`<span class="tag bad">${esc(NPCSTAT[n.status]||n.status)}</span>`:''}</div>`;}).join('')}</div>${list.length>12?`<p class="muted" style="margin:0">${list.length-12} more — search to find them.</p>`:''}`:`<p class="empty">${q?'No matches.':'No NPCs yet.'}</p>`}
  <div class="row"><input class="grow" id="newNpc" placeholder="New NPC name"><button class="sm" data-act="addnpc">Add</button></div>`;}
function vClocks(){const cs=G.data.story.clocks;
 return`<h2>Pressure clocks</h2>${cs.length?`<div class="lst">${cs.map((c,i)=>`<div class="row"><input class="grow" data-k="story.clocks.${i}.name" value="${esc(c.name)}"><div class="pips">${Array.from({length:c.size},(_,k)=>`<button class="${k<c.filled?'f':''}" data-act="pip" data-i="${i}" data-k="${k}" aria-label="Segment ${k+1}"></button>`).join('')}</div><button class="sm ghost" data-act="rm" data-p="story.clocks" data-i="${i}" aria-label="Remove">✕</button></div>`).join('')}</div>`:'<p class="empty">Clocks tick toward trouble when players ignore something.</p>'}
  <div class="row"><input class="grow" id="newClock" placeholder="e.g. Ledgerer debt comes due"><select id="newClockSize" aria-label="Segments"><option>4</option><option selected>6</option><option>8</option></select><button class="sm" data-act="addclock">Add</button></div>`;}

/* ---------- drawer ---------- */
function drawerTitle(){const d=G.drawer;if(!d)return'';
 if(d.type==='arc'){const a=G.data.story.arcs.find(x=>x.id===d.id);return a?a.title:'Arc';}
 if(d.type==='npc'){const n=G.data.npcs.find(x=>x.id===d.id);return n?n.name||'NPC':'NPC';}
 if(d.type==='pc')return charName(d.id);
 if(d.type==='tok'){const t=mapToks()[d.id];return t?t.name||'Token':'Token';}
 return{poll:'Polls',factions:'Factions',import:'Import / export story',sessions:'All sessions',newmap:'New battle map'}[d.type]||'';}
function vDrawer(){const d=G.drawer;
 if(d.type==='arc'){const i=G.data.story.arcs.findIndex(x=>x.id===d.id);if(i<0){G.drawer=null;return'';}const a=G.data.story.arcs[i];
  return`<div class="grid"><label>Name<input data-k="story.arcs.${i}.title" value="${esc(a.title)}"></label><label>Type<select data-ch="story.arcs.${i}.kind">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}" ${a.kind===k?'selected':''}>${v}</option>`).join('')}</select></label>
   <label>Status<select data-ch="story.arcs.${i}.status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${a.status===k?'selected':''}>${v}</option>`).join('')}</select></label></div>
   <label>Summary / the truth behind it<textarea data-k="story.arcs.${i}.summary">${esc(a.summary||'')}</textarea></label>
   <h2>Milestones<span class="sp"></span><span class="n">${a.milestones.filter(m=>m.done).length}/${a.milestones.length}</span></h2>
   <div class="lst">${a.milestones.map((m,j)=>`<div class="ck-row ${m.done?'done':''}"><input type="checkbox" data-ck="story.arcs.${i}.milestones.${j}.done" ${m.done?'checked':''} aria-label="Done"><input type="text" data-k="story.arcs.${i}.milestones.${j}.text" value="${esc(m.text)}">
    <button class="sm ghost" data-act="up" data-p="story.arcs.${i}.milestones" data-i="${j}" aria-label="Move up" ${j?'':'disabled'}>↑</button><button class="sm ghost" data-act="rm" data-p="story.arcs.${i}.milestones" data-i="${j}" aria-label="Remove">✕</button></div>`).join('')||'<p class="empty">No milestones yet.</p>'}</div>
   <div class="row"><input class="grow" id="newMs" placeholder="Add a milestone"><button class="sm" data-act="addms" data-i="${i}">Add</button></div>
   <div class="row" style="margin-top:10px"><button class="sm" data-act="up" data-p="story.arcs" data-i="${i}" ${i?'':'disabled'}>Move up in list</button><span style="flex:1"></span><button class="sm bad" data-act="rmconfirm" data-p="story.arcs" data-i="${i}" data-name="${esc(a.title)}">Delete arc</button></div>`;}
 if(d.type==='npc'){const i=G.data.npcs.findIndex(x=>x.id===d.id);if(i<0){G.drawer=null;return'';}const n=G.data.npcs[i];
  return`<div class="grid"><label>Name<input data-k="npcs.${i}.name" value="${esc(n.name)}"></label><label>Faction<input data-k="npcs.${i}.faction" value="${esc(n.faction||'')}" list="facList"></label>
   <label>Role<input data-k="npcs.${i}.role" value="${esc(n.role||'')}" placeholder="Ledgerer agent, Navigator…"></label>
   <label>Attitude to party<select data-ch="npcs.${i}.attitude">${ATT.map(([v,l])=>`<option value="${v}" ${String(n.attitude??0)===v?'selected':''}>${l}</option>`).join('')}</select></label>
   <label>Status<select data-ch="npcs.${i}.status">${Object.entries(NPCSTAT).map(([k,v])=>`<option value="${k}" ${(n.status||'alive')===k?'selected':''}>${v}</option>`).join('')}</select></label>
   <label>Last seen<input data-k="npcs.${i}.where" value="${esc(n.where||'')}"></label></div>
   <label class="ck"><input type="checkbox" data-ck="npcs.${i}.companion" ${n.companion?'checked':''}> Travels with the party (shows under Companions)</label>
   <div class="grid"><label>HP<input type="number" data-n="hp" data-i="${i}" value="${esc(n.hp??'')}"></label><label>Max HP<input type="number" data-n="maxHp" data-i="${i}" value="${esc(n.maxHp??'')}"></label>
    <label>AC<input type="number" data-n="ac" data-i="${i}" value="${esc(n.ac??'')}"></label><label>Speed (ft)<input type="number" step="5" data-n="speed" data-i="${i}" value="${esc(n.speed??30)}"></label></div>
   ${(()=>{const t=npcToken(n);if(t)return`<div class="row"><span class="tag ok">On the battle map</span><button class="sm" data-act="dtok" data-id="${esc(t.id)}">Combat controls</button></div>`;
     return G.map&&G.map.meta&&G.map.meta.cells?`<div class="row"><button data-act="npc2map" data-i="${i}">Put on the battle map</button><label class="ck"><input type="checkbox" id="n2mHid"> hidden</label></div>`:'';})()}
   <label>What the players know<textarea data-k="npcs.${i}.notes">${esc(n.notes||'')}</textarea></label>
   <label>Secret (GM only)<textarea data-k="npcs.${i}.secret">${esc(n.secret||'')}</textarea></label>
   <datalist id="facList">${G.data.factions.map(f=>`<option value="${esc(f.name)}">`).join('')}</datalist>
   <div class="row"><span style="flex:1"></span><button class="sm bad" data-act="rmconfirm" data-p="npcs" data-i="${i}" data-name="${esc(n.name)}">Delete NPC</button></div>`;}
 if(d.type==='pc')return vPc(d.id);
 if(d.type==='tok')return vTok(d.id);
 if(d.type==='poll')return vPollDrawer();
 if(d.type==='factions')return`${G.data.factions.map((f,i)=>`<div class="pc" style="cursor:default"><div class="row"><input class="grow" data-k="factions.${i}.name" value="${esc(f.name)}" placeholder="Faction"><label class="ck">Standing<select data-ch="factions.${i}.standing">${[-3,-2,-1,0,1,2,3].map(v=>`<option value="${v}" ${+f.standing===v?'selected':''}>${sgn(v)}</option>`).join('')}</select></label><button class="sm ghost" data-act="rmconfirm" data-p="factions" data-i="${i}" data-name="${esc(f.name)}" aria-label="Remove">✕</button></div>
   <input data-k="factions.${i}.motive" value="${esc(f.motive||'')}" placeholder="What they want"><textarea data-k="factions.${i}.notes" placeholder="Notes">${esc(f.notes||'')}</textarea></div>`).join('')||'<p class="empty">No factions yet.</p>'}
   <div class="row"><input class="grow" id="newFac" placeholder="New faction"><button class="sm" data-act="addfac">Add</button></div>`;
 if(d.type==='import')return`<p class="muted" style="margin:0">Paste story JSON from a Claude skill to add arcs, milestones, goals and clocks. Nothing is overwritten; an arc with the same name gets the new milestones added.</p>
   <textarea id="impTxt" style="min-height:200px" placeholder='{"arcs":[{"title":"The Inheritance","kind":"main","milestones":["Clear the Footfall debt","Find Oriel"]}],"goals":["..."],"clocks":[{"name":"...","size":6}]}'></textarea>
   <div class="row"><button class="pri" data-act="import">Import</button><button data-act="export">Copy current story as JSON</button></div>`;
 if(d.type==='sessions')return G.data.sessions.map((x,i)=>`<div class="pc" style="cursor:default"><div class="row"><input type="date" data-k="sessions.${i}.date" value="${esc(x.date||'')}"><input class="grow" data-k="sessions.${i}.title" value="${esc(x.title||'')}"><button class="sm ghost" data-act="rmconfirm" data-p="sessions" data-i="${i}" data-name="${esc(x.title||'this session')}" aria-label="Remove">✕</button></div><textarea data-k="sessions.${i}.notes">${esc(x.notes||'')}</textarea></div>`).join('');
 if(d.type==='newmap'){const g=G.gen||(G.gen={theme:'ship',size:'m',seed:String(1000+Math.floor(Math.random()*9000))});const has=G.map&&G.map.meta&&G.map.meta.cells;
  return`<p class="muted" style="margin:0">Each square is 5 ft. The new map starts <b>hidden from players</b>; reveal it from the top bar, or start combat on the map's Turn tab.${has?' Tokens already on the map stay and move to open squares (party at the start, enemies at the far end).':''}</p>
   <div class="grid"><label>Setting<select id="gTheme">${Object.entries(THEMES).map(([k,n])=>`<option value="${k}" ${g.theme===k?'selected':''}>${n}</option>`).join('')}</select></label>
   <label>Size<select id="gSize">${Object.entries(SIZES).map(([k,v])=>`<option value="${k}" ${g.size===k?'selected':''}>${v[2]}</option>`).join('')}</select></label></div>
   <div class="row"><label class="grow">Seed (same seed = same map)<input id="gSeed" value="${esc(g.seed)}"></label><button data-act="reroll" title="New seed" style="align-self:flex-end">🎲</button></div>
   <button class="pri" data-act="genmap">${has?'Replace the current map':'Generate map'}</button>
   <p class="muted" style="margin:0">To paint walls or add enemies, use the GM tab on the map itself.</p>`;}
 return'';
}
function vTok(id){const t=mapToks()[id];if(!t){G.drawer=null;return'';}const ref=t.npcRef&&G.data.npcs.find(n=>n.id===t.npcRef);
 return`<div class="grid"><label>Name<input data-t="name" value="${esc(t.name||'')}"></label><label>HP<input type="number" data-t="hp" value="${esc(t.hp??'')}"></label><label>Max HP<input type="number" data-t="maxHp" value="${esc(t.maxHp??'')}"></label>
   <label>AC<input type="number" data-t="ac" value="${esc(t.ac??'')}"></label><label>Speed (ft)<input type="number" step="5" data-t="speed" value="${esc(t.speed??30)}"></label><label>Initiative<input type="number" data-t="init" value="${esc(t.init??'')}"></label>
   <label>Size<select data-t="size">${[[1,'1 square'],[2,'2×2'],[3,'3×3'],[4,'4×4']].map(([v,l])=>`<option value="${v}" ${(t.size||1)==v?'selected':''}>${l}</option>`).join('')}</select></label></div>
  <div class="row"><input type="number" inputmode="numeric" class="qd" placeholder="amount" style="width:90px" aria-label="Amount"><button class="bad" data-act="tdmg" data-id="${esc(id)}">− Damage</button><button data-act="theal" data-id="${esc(id)}">+ Heal</button></div>
  <h2>Conditions</h2><div class="row">${CONDS.map(c=>`<button class="sm ${(t.cond||[]).includes(c)?'on':''}" data-act="tcond" data-id="${esc(id)}" data-c="${c}">${c}</button>`).join('')}</div>
  <label class="ck"><input type="checkbox" data-tf="hidden" ${t.hidden?'checked':''}> Hidden from players</label>
  <label class="ck"><input type="checkbox" data-tf="free" ${t.free?'checked':''}> Players can move it</label>
  <div class="row" style="margin-top:6px">${ref?`<button class="sm" data-act="dnpc" data-id="${esc(ref.id)}">Open ${esc(ref.name)} in NPC list</button>`:`<button class="sm" data-act="tok2npc" data-id="${esc(id)}">Save to NPC list</button>`}<span style="flex:1"></span><button class="sm bad" data-act="tdel" data-id="${esc(id)}">Remove from map</button></div>

  const live=!(G.map.meta&&G.map.meta.live===false);const shown=!t.hidden&&(t.kind==='pc'||live);

  if(t.npcRef){const n=G.data.npcs.find(x=>x.id===t.npcRef);if(n){let ch=false;['hp','maxHp','ac','speed'].forEach(k=>{if(t[k]!==undefined&&n[k]!==t[k]){n[k]=t[k];ch=true;}});if(ch)dirty();}}

async function npcToMap(n,hidden){

  x:p.x,y:p.y,size:1,hp:n.hp??null,maxHp:n.maxHp??null,ac:n.ac??null,speed:n.speed||30,hidden:!!hidden,free:!!n.companion,cond:[]};

async function mapMeta(fn,msg){
 try{const r=await rpc('map_get',{p_party:G.code,p_pin:G.pin});const m=r.meta;if(!m||!m.cells){toast('No map yet.');return;}m.init=m.init||{on:false,order:[],turn:0,round:1};G.map=r;
  if(fn(m)===false)return;await rpc('map_save_meta',{p_party:G.code,p_pin:G.pin,p_meta:m});pingMap();
  if(msg)toast(msg,true);await loadMap();
 }catch(err){toast(err.message||'Couldn’t update the map.');}
}
async function genMap(){
 const g=G.gen={theme:$('#gTheme').value,size:$('#gSize').value,seed:($('#gSeed').value||'').trim()||'1'};
 try{const r=await rpc('map_get',{p_party:G.code,p_pin:G.pin});const old=r.meta||{};
  if(old.cells&&!confirm('Replace the current map for everyone?'))return;
  const[w,h]=SIZES[g.size];const m=generate(g.theme,w,h,g.seed);m.init=old.init||{on:false,order:[],turn:0,round:1};m.live=false;
  await rpc('map_save_meta',{p_party:G.code,p_pin:G.pin,p_meta:m});
  const placed=[];for(const t of Object.values(r.tokens||{})){const s=t.size||1;const anchor=t.kind==='pc'?m.start:m.foe;
   const p=nearestWalk(m,anchor.x,anchor.y,s,(x,y,ss)=>placed.some(o=>x<o.x+o.s&&x+ss>o.x&&y<o.y+o.s&&y+ss>o.y));
   if(p){placed.push({x:p.x,y:p.y,s});if(p.x!==t.x||p.y!==t.y)await rpc('map_token_put',{p_party:G.code,p_pin:G.pin,p_token:Object.assign({},t,{x:p.x,y:p.y})});}}
  pingMap();G.drawer=null;toast('New map ready. It’s hidden from players until you reveal it.',true);await loadMap();
  const f=$('#mapf');if(f&&f.contentWindow){try{f.contentWindow.location.reload();}catch(err){f.src=f.src;}}
 }catch(err){toast(err.message||'Couldn’t make the map.');}
}
async function sendPoll(){
 const D=G.pollDraft;const q=($('#pQ').value||'').trim();const opts=($('#pO').value||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,8);const free=$('#pF').checked;
 if(!q){toast('Write a question first.');return;}if(!D.to.length){toast('Pick at least one player.');return;}
 const group='p'+Date.now().toString(36)+uid().slice(0,3);
 try{await rpc('poll_send',{p_party:G.code,p_pin:G.pin,p_group:group,p_chars:D.to,p_data:{q,opts,free}});
  try{G.qchan.send({type:'broadcast',event:'poll',payload:{chars:D.to}});}catch(err){}
  G.pollDraft={to:[]};toast('Poll sent.',true);await loadPolls();
 }catch(err){toast(err.message||'Couldn’t send.');}
}
$('#lGo').onclick=()=>{const c=normCode($('#lCode').value);const p=$('#lPin').value;if(c.length<9){$('#lErr').textContent='Party codes look like VOID-7K3Q.';return;}if(p.length<4){$('#lErr').textContent='PINs are 4 or more characters.';return;}unlock(c,p);};
$('#lPin').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lGo').click();});
$('#lockBtn').onclick=()=>{lsSet('rtm.map.pin.'+G.code,null);location.reload();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&G.drawer)closeDrawer();});
(function init(){
 if(lsGet('rtm.gm.bigmap')){$('#cc').classList.add('bigmap');$('#bigBtn').textContent='⤡ Smaller';}
 const code=normCode(lsGet('rtm.party.code'));const pin=code.length===9?lsGet('rtm.map.pin.'+code):null;
 if(code.length===9&&pin)unlock(code,pin).then(()=>{if(!G.data)relock();});
 else relock();
})();
</script>
