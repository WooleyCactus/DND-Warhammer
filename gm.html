<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>GM Screen · Rogue Trader Manifest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Cinzel:wght@500;700&family=Share+Tech+Mono&display=swap">
<style>
:root{
 --bg:#0D0C0A;--plate:#1B1815;--plate-hi:#25201B;--sunk:#0A0908;--ink:#E8DEC6;--muted:#A0957D;--line:#3B3229;
 --gold:#C8A24A;--gold-hi:#EBCB7A;--gold-dk:#7A5C1E;--blood:#B3262A;--blood-dk:#5E0F12;--warp:#8E5BC4;--ok:#7FA36A;--warn:#D08A2E;
 --f-display:'Cinzel',Georgia,serif;--f-body:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
 color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(180deg,#221d18,var(--plate));border-bottom:1px solid var(--gold-dk);flex-wrap:wrap}
h1{font:700 15px var(--f-display);letter-spacing:.08em;color:var(--gold-hi);margin:0;white-space:nowrap}
header .sp{flex:1}
header a{color:var(--gold-hi);font-size:14px}
.code{font:13px var(--f-mono);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.dot.live{background:var(--ok);box-shadow:0 0 6px var(--ok)}.dot.off{background:var(--blood)}
#save{font:12px var(--f-mono);color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--plate);border-bottom:1px solid var(--line);position:sticky;top:var(--hh,49px);z-index:4}
nav.tabs button{flex:1 0 auto;border:0;border-radius:0;background:transparent;padding:11px 14px;font:700 12px var(--f-display);letter-spacing:.1em;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--gold-hi);border-bottom-color:var(--gold)}
nav.tabs .n{font:11px var(--f-mono);background:var(--blood);color:#fff;border-radius:8px;padding:0 5px;margin-left:4px}
main{max-width:980px;margin:0 auto;padding:14px;padding-bottom:max(40px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
section.box{background:var(--plate);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
h2{font:700 13px var(--f-display);letter-spacing:.12em;color:var(--gold);margin:0;text-transform:uppercase;display:flex;align-items:center;gap:8px}
h2 .sp{flex:1}
select,input,textarea,button{font:inherit;color:var(--ink)}
select,input,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:2px;padding:6px 8px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:1px solid var(--gold);border-color:var(--gold)}
button{background:var(--plate-hi);border:1px solid var(--line);border-radius:2px;padding:7px 11px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--gold-dk)}
button.pri{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#140F06;border-color:var(--gold-dk);font-weight:700}
button.bad{border-color:var(--blood-dk);color:#f0b8b8}
button.sm{padding:3px 8px;font-size:13px}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.on{border-color:var(--gold);background:#3a2f1c;color:var(--gold-hi)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px}
label>input,label>select,label>textarea{width:100%}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--sunk);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card.open{border-color:var(--gold-dk)}
.card .hd{display:flex;align-items:center;gap:10px;cursor:pointer}
.card .hd .t{flex:1;min-width:0;font-weight:700}
.tag{font:11px var(--f-mono);border:1px solid var(--line);padding:1px 6px;color:var(--muted);white-space:nowrap}
.tag.main{color:var(--gold-hi);border-color:var(--gold-dk)}.tag.done{color:var(--ok)}.tag.bad{color:#f08080;border-color:var(--blood-dk)}
.bar{height:6px;background:#2a241e;position:relative;min-width:80px;flex:0 0 110px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
@media (max-width:600px){.card .hd{flex-wrap:wrap}.card .hd .t{flex:1 1 100%;order:-1}.bar{flex:1 1 60px}.row>.grow{min-width:100px}}
.ms{display:flex;gap:6px;align-items:center}
.ms input[type=text]{flex:1}
.ms.done input[type=text]{color:var(--muted);text-decoration:line-through}
.pips{display:flex;gap:3px}
.pips button{width:20px;height:20px;padding:0;border-radius:50%}
.pips button.f{background:var(--blood);border-color:var(--blood)}
.pc{display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.stats{display:flex;gap:12px;flex-wrap:wrap;font:13px var(--f-mono);color:var(--muted)}
.stats b{color:var(--ink);font-weight:400}
.hpbar{height:8px;background:#2a241e;position:relative}
.hpbar i{position:absolute;inset:0 auto 0 0}
.ab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:560px){.ab{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lst{display:flex;flex-direction:column;gap:6px}
.lst .r{display:flex;gap:6px;align-items:center}
.lst .r input{flex:1;min-width:0}
.lst .r input[type=checkbox]{flex:0 0 auto;width:18px;height:18px}
.ans{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px dashed var(--line)}
.ans .who{min-width:110px;color:var(--muted)}
#lock{position:fixed;inset:0;background:rgba(8,7,10,.96);display:grid;place-items:center;padding:20px;z-index:20}
#lock .box{background:var(--plate);border:1px solid var(--gold-dk);padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
#lock h3{font:700 18px var(--f-display);color:var(--gold-hi);margin:0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2b1214;border:1px solid var(--blood);padding:8px 14px;max-width:90%;z-index:30}
#toast.ok{background:#16200f;border-color:var(--ok)}
.empty{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<header id="hdr">
 <h1>☩ GM Screen</h1><span class="dot" id="dot"></span><span class="code" id="codeLbl"></span><span id="save"></span>
 <span class="sp"></span><a href="map.html">Battle map</a><a href="./">Sheets</a><button class="sm ghost" id="lockBtn" title="Lock this device">Lock</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div id="lock" hidden><div class="box">
 <h3>GM Screen</h3>
 <p class="muted" style="margin:0">Story notes, NPCs and polls here are only visible with the GM PIN. It's the same PIN as the battle map. If this party has no PIN yet, the one you enter becomes it.</p>
 <label>Party code<input id="lCode" placeholder="VOID-7K3Q" autocomplete="off" autocapitalize="characters"></label>
 <label>GM PIN<input id="lPin" type="password" autocomplete="off"></label>
 <button class="pri" id="lGo">Unlock</button>
 <p class="muted" id="lErr" style="margin:0;color:#f08080"></p>
</div></div>
<div id="toast" hidden></div>
<script>
const SUPA_URL='https://xpljuyatduvrbhiwfbwn.supabase.co',SUPA_KEY='sb_publishable_zU8au39xaYFxmL3cZH09gQ_w95iJkD5',
 SUPA_LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{v==null||v===''?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}};
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^(.{4})(.+)$/,'$1-$2').slice(0,9);
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const ABIL=['str','dex','con','int','wis','cha'];
const KINDS={main:'Main arc',thread:'Side thread',quest:'Quest',player:'Player-started'};
const STATUS={active:'Active',paused:'On hold',done:'Resolved',failed:'Failed'};
const ATT=[['-2','Hostile'],['-1','Wary'],['0','Neutral'],['1','Friendly'],['2','Allied']];
const NPCSTAT={alive:'Alive',dead:'Dead',missing:'Missing',unknown:'Unknown'};
const CONDS=['Prone','Grappled','Restrained','Stunned','Frightened','Poisoned','Blinded','Unconscious','Concentrating'];

const G={code:'',pin:'',client:null,data:null,chars:[],map:null,polls:[],tab:lsGet('rtm.gm.tab')||'story',open:{},edit:null,pollDraft:{to:[]},status:'connecting'};

/* ---------- connection ---------- */
function loadScript(src){return new Promise((ok,no)=>{if(window.supabase)return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function rpc(fn,args){const{data,error}=await G.client.rpc(fn,args);if(error)throw error;return data;}
function blank(){return{v:1,story:{arcs:[],goals:[],clocks:[]},npcs:[],factions:[],sessions:[],notes:'',pcNotes:{}};}
function norm(d){const b=blank();d=Object.assign(b,d||{});d.story=Object.assign(blank().story,d.story||{});d.pcNotes=d.pcNotes||{};return d;}
async function unlock(code,pin){
 $('#lErr').textContent='';
 try{await loadScript(SUPA_LIB);}catch(e){$('#lErr').textContent='Couldn’t reach the server. Check your connection.';return;}
 G.client=G.client||window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false}});
 try{const ok=await rpc('map_claim_gm',{p_party:code,p_pin:pin});if(!ok){$('#lErr').textContent='That PIN doesn’t match this party.';return;}}
 catch(e){$('#lErr').textContent=e.message||'Couldn’t check the PIN.';return;}
 G.code=code;G.pin=pin;lsSet('rtm.party.code',code);lsSet('rtm.map.pin.'+code,pin);lsSet('rtm.map.role.'+code,'gm');
 $('#lock').hidden=true;$('#codeLbl').textContent=code;
 subscribe();await loadAll();
}
function subscribe(){
 const room=G.code.replace('-','');
 G.pchan=G.client.channel('party-'+room,{config:{broadcast:{self:false}}}).on('broadcast',{event:'changed'},()=>loadChars()).subscribe(st=>setStatus(st));
 G.mchan=G.client.channel('map-'+room,{config:{broadcast:{self:false}}}).on('broadcast',{event:'meta'},()=>loadMap()).on('broadcast',{event:'reload'},()=>loadMap())
  .on('broadcast',{event:'tok'},()=>loadMapSoon()).on('broadcast',{event:'del'},()=>loadMapSoon()).subscribe();
 G.qchan=G.client.channel('polls-'+room,{config:{broadcast:{self:false}}}).on('broadcast',{event:'answered'},()=>loadPolls()).subscribe();
 setInterval(()=>{if(document.visibilityState==='visible'){loadChars();loadMap();loadPolls();}},25000);
}
function setStatus(st){G.status=st==='SUBSCRIBED'?'live':st==='CHANNEL_ERROR'||st==='TIMED_OUT'?'off':'connecting';$('#dot').className='dot '+(G.status==='live'?'live':G.status==='off'?'off':'');}
async function loadAll(){await Promise.all([loadData(),loadChars(),loadMap(),loadPolls()]);render();}
async function loadData(){try{const r=await rpc('gm_get',{p_party:G.code,p_pin:G.pin});G.data=norm(r.data);}catch(e){toast(e.message);if(/PIN/.test(e.message||''))relock();}}
async function loadChars(){try{G.chars=(await rpc('party_list',{p_party:G.code}))||[];if(G.tab==='party'||G.tab==='polls')renderSoft();}catch(e){}}
async function loadMap(){try{G.map=await rpc('map_get',{p_party:G.code,p_pin:G.pin});if(G.tab==='session'||G.tab==='party')renderSoft();}catch(e){}}
let mapT=0;function loadMapSoon(){clearTimeout(mapT);mapT=setTimeout(loadMap,800);}
async function loadPolls(){try{G.polls=(await rpc('poll_list',{p_party:G.code,p_pin:G.pin}))||[];renderTabs();if(G.tab==='polls')renderSoft();}catch(e){}}
function relock(){$('#lock').hidden=false;$('#lCode').value=G.code||normCode(lsGet('rtm.party.code'));$('#lPin').value='';}

/* ---------- saving the GM notes ---------- */
let saveT=0,saving=false,again=false;
function dirty(){$('#save').textContent='Unsaved…';clearTimeout(saveT);saveT=setTimeout(save,700);}
async function save(){
 if(saving){again=true;return;}saving=true;$('#save').textContent='Saving…';
 try{await rpc('gm_save',{p_party:G.code,p_pin:G.pin,p_data:G.data});$('#save').textContent='Saved';}
 catch(e){$('#save').textContent='Not saved';toast('Couldn’t save: '+(e.message||'unknown error'));}
 saving=false;if(again){again=false;save();}
}
window.addEventListener('beforeunload',e=>{if($('#save').textContent==='Unsaved…'||saving){save();e.preventDefault();e.returnValue='';}});

/* ---------- helpers ---------- */
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setPath(o,p,v){const ks=p.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k]=a[k]||{},o);t[last]=v;}
const mod=v=>Math.floor(((+v||10)-10)/2);
const sgn=n=>(n>=0?'+':'')+n;
function charInfo(r){const d=r.data||{},src=d.src||{},st=d.state||{};const lvl=(src.classes||[]).reduce((a,c)=>a+(+c.level||0),0)||1;const pb=2+Math.floor((lvl-1)/4);
 const per=(src.skills||{}).perception||0;const max=+src.maxHp||0;
 return{id:r.id,name:src.name||'Unnamed',player:src.player||'',cls:(src.classes||[]).map(c=>(c.cls||'?').replace(/^./,x=>x.toUpperCase())+' '+(c.level||1)+(c.sub?' ('+c.sub+')':'')).join(' / '),
  lvl,hp:st.hp==null?max:+st.hp,max,temp:+st.temp||0,ac:src.ac,speed:+src.speed||30,pp:10+mod((src.abilities||{}).wis)+pb*per,
  corruption:+st.corruption||0,insanity:+st.insanity||0,abil:src.abilities||{}};}
function tokenFor(id){const t=G.map&&G.map.tokens&&G.map.tokens['pc-'+id];return t||null;}
let toastT=0;function toast(m,ok){const t=$('#toast');t.textContent=m;t.className=ok?'ok':'';t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200);}

/* ---------- render ---------- */
function renderTabs(){
 const waiting=new Set(G.polls.filter(p=>p.answer==null).map(p=>p.id.split(':')[0])).size;
 const answered=G.polls.filter(p=>p.answer!=null&&!(G.data&&G.data.seen&&G.data.seen[p.id])).length;
 const tabs=[['story','Story'],['party','Party'],['npcs','NPCs & factions'],['session','Session & map'],['polls','Polls'+(answered?`<span class="n">${answered}</span>`:'')]];
 $('#tabs').innerHTML=tabs.map(([k,n])=>`<button data-tab="${k}" class="${G.tab===k?'on':''}">${n}</button>`).join('');
 document.documentElement.style.setProperty('--hh',$('#hdr').offsetHeight+'px');
}
function render(){if(!G.data)return;renderTabs();
 const v={story:vStory,party:vParty,npcs:vNpcs,session:vSession,polls:vPolls}[G.tab]||vStory;$('#main').innerHTML=v();}
// Re-render unless the GM is typing in this view.
let pend=false;function renderSoft(){const a=document.activeElement;if(a&&$('#main').contains(a)&&a.matches('input,textarea,select')){pend=true;return;}render();}
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(pend&&!(a&&$('#main').contains(a)&&a.matches('input,textarea,select'))){pend=false;render();}},0));

function vStory(){
 const s=G.data.story;const arcs=s.arcs;
 const allMs=arcs.reduce((a,x)=>a+x.milestones.length,0),doneMs=arcs.reduce((a,x)=>a+x.milestones.filter(m=>m.done).length,0);
 const goals=s.goals;
 return`<section class="box"><h2>This session's goals<span class="sp"></span><button class="sm ghost" data-act="cleargoals" ${goals.some(g=>g.done)?'':'disabled'}>Clear done</button></h2>
  ${goals.length?`<div class="lst">${goals.map((g,i)=>`<div class="r ms ${g.done?'done':''}"><input type="checkbox" data-ck="story.goals.${i}.done" ${g.done?'checked':''}><input type="text" data-k="story.goals.${i}.text" value="${esc(g.text)}"><button class="sm ghost" data-act="rm" data-p="story.goals" data-i="${i}" aria-label="Remove">✕</button></div>`).join('')}</div>`:'<p class="empty" style="margin:0">No goals set for this session.</p>'}
  <div class="row"><input class="grow" id="newGoal" placeholder="Add a goal, e.g. Players learn Oriel visited the Stryxis"><button data-act="addgoal">Add</button></div></section>
 <section class="box"><h2>Arcs, threads &amp; quests<span class="sp"></span><span class="muted" style="text-transform:none;letter-spacing:0;font-family:var(--f-body)">${doneMs}/${allMs} milestones</span></h2>
  ${arcs.length?arcs.map((a,i)=>arcCard(a,i)).join(''):'<p class="empty" style="margin:0">No arcs yet. Add your main storyline and any side threads, then break each into milestones.</p>'}
  <div class="row"><input class="grow" id="newArc" placeholder="New arc or quest name"><select id="newKind">${Object.entries(KINDS).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><button class="pri" data-act="addarc">Add</button></div></section>
 <section class="box"><h2>Pressure clocks</h2>
  ${s.clocks.length?s.clocks.map((c,i)=>`<div class="row"><input class="grow" data-k="story.clocks.${i}.name" value="${esc(c.name)}"><div class="pips">${Array.from({length:c.size},(_,k)=>`<button class="${k<c.filled?'f':''}" data-act="pip" data-i="${i}" data-k="${k}" aria-label="Segment ${k+1}"></button>`).join('')}</div><span class="tag ${c.filled>=c.size?'bad':''}">${c.filled}/${c.size}</span><button class="sm ghost" data-act="rm" data-p="story.clocks" data-i="${i}" aria-label="Remove">✕</button></div>`).join(''):'<p class="empty" style="margin:0">Clocks tick toward trouble when players ignore something.</p>'}
  <div class="row"><input class="grow" id="newClock" placeholder="e.g. Ledgerer debt comes due"><select id="newClockSize"><option>4</option><option selected>6</option><option>8</option></select><button data-act="addclock">Add</button></div></section>
 <section class="box"><h2>Import / export</h2>
  <p class="muted" style="margin:0">Paste story JSON from a Claude skill to add arcs, milestones, goals and clocks. Nothing is overwritten; arcs with the same name get the new milestones added.</p>
  <textarea id="impTxt" placeholder='{"arcs":[{"title":"The Inheritance","kind":"main","milestones":["Clear the Footfall debt","Find Oriel"]}],"goals":["..."],"clocks":[{"name":"...","size":6}]}'></textarea>
  <div class="row"><button data-act="import">Import</button><button data-act="export">Copy story as JSON</button></div></section>`;
}
function arcCard(a,i){
 const n=a.milestones.length,d=a.milestones.filter(m=>m.done).length,open=G.open['arc'+a.id];const pct=n?Math.round(d/n*100):0;
 const next=a.milestones.find(m=>!m.done);
 return`<div class="card ${open?'open':''}"><div class="hd" data-act="toggle" data-id="arc${a.id}">
  <span class="tag ${a.kind==='main'?'main':''}">${esc(KINDS[a.kind]||a.kind)}</span><span class="t">${esc(a.title||'Untitled')}</span>
  <span class="tag ${a.status==='done'?'done':a.status==='failed'?'bad':''}">${esc(STATUS[a.status]||a.status)}</span>
  <span class="bar" title="${d} of ${n} milestones"><i style="width:${pct}%"></i></span><span class="muted">${d}/${n}</span><span>${open?'▴':'▾'}</span></div>
  ${!open&&next?`<div class="muted">Next: ${esc(next.text)}</div>`:''}
  ${open?`<div class="grid"><label>Name<input data-k="story.arcs.${i}.title" value="${esc(a.title)}"></label><label>Type<select data-ch="story.arcs.${i}.kind">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}" ${a.kind===k?'selected':''}>${v}</option>`).join('')}</select></label>
   <label>Status<select data-ch="story.arcs.${i}.status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${a.status===k?'selected':''}>${v}</option>`).join('')}</select></label></div>
   <label>Summary / the truth behind it (GM only)<textarea data-k="story.arcs.${i}.summary">${esc(a.summary||'')}</textarea></label>
   <div class="lst">${a.milestones.map((m,j)=>`<div class="r ms ${m.done?'done':''}"><input type="checkbox" data-ck="story.arcs.${i}.milestones.${j}.done" ${m.done?'checked':''}><span class="muted">${j+1}.</span><input type="text" data-k="story.arcs.${i}.milestones.${j}.text" value="${esc(m.text)}">
    <button class="sm ghost" data-act="up" data-p="story.arcs.${i}.milestones" data-i="${j}" aria-label="Move up" ${j?'':'disabled'}>↑</button><button class="sm ghost" data-act="rm" data-p="story.arcs.${i}.milestones" data-i="${j}" aria-label="Remove">✕</button></div>`).join('')}</div>
   <div class="row"><input class="grow" id="ms${a.id}" placeholder="Add a milestone"><button data-act="addms" data-i="${i}" data-id="${a.id}">Add milestone</button></div>

function vPolls(){

  case'eaddw':G.edit.d.src.weapons=(G.edit.d.src.weapons||[]);G.edit.d.src.weapons.push({name:'New weapon',atk:'',dmg:''});G.edit.changed.add('src.weapons');render();break;
  case'eaddi':{const t=val('newItem');if(!t)return;const q=+$('#newQty').value||1;G.edit.d.state.inv.push({id:'g'+uid(),name:t,qty:q,cat:'gear'});G.edit.changed.add('state.inv');render();break;}
  case'erm':{getPath(G.edit.d,b.dataset.p).splice(+b.dataset.i,1);G.edit.changed.add(b.dataset.p);render();break;}
  case'eapply':await applyEdit();break;
  case'maplive':await mapMeta(m=>{m.live=b.dataset.v==='1';},b.dataset.v==='1'?'Map revealed to players.':'Map hidden from players.');break;
  case'nextturn':await mapMeta(m=>{const I=m.init;const toks=G.map.tokens||{};const order=(I.order||[]).filter(id=>toks[id]);if(!order.length)return false;let i=order.indexOf(I.order[I.turn]);i=i<0?0:i+1;if(i>=order.length){i=0;I.round++;}I.order=order;I.turn=i;});break;
  case'endcombat':if(confirm('End combat for everyone?'))await mapMeta(m=>{m.init={on:false,order:[],turn:0,round:1};},'Combat ended.');break;
  case'pto':{const id=b.dataset.id;const t=G.pollDraft.to;const i=t.indexOf(id);i<0?t.push(id):t.splice(i,1);render();break;}
  case'ptoall':G.pollDraft.to=G.chars.map(r=>r.id);render();break;
  case'psend':await sendPoll();break;
  case'pdel':if(confirm('Remove this poll for everyone?')){try{await rpc('poll_delete',{p_party:G.code,p_pin:G.pin,p_group:b.dataset.g});loadPolls();}catch(err){toast(err.message);}}break;
 }
});
async function applyEdit(){
 const E=G.edit;if(!E||!E.changed.size)return;
 try{const rows=await rpc('party_list',{p_party:G.code});const fresh=rows.find(x=>x.id===E.id);if(!fresh){toast('That character no longer exists.');return;}
  const d=clone(fresh.data);d.src=d.src||{};d.state=d.state||{};
  E.changed.forEach(p=>setPath(d,p,clone(getPath(E.d,p)===undefined?null:getPath(E.d,p))));
  d.updatedAt=Date.now();
  await rpc('party_save',{p_party:G.code,p_id:E.id,p_data:d});
  try{G.pchan.send({type:'broadcast',event:'changed',payload:{t:Date.now()}});}catch(err){}
  toast('Applied to '+((d.src&&d.src.name)||'the sheet')+'.',true);G.edit=null;await loadChars();render();
 }catch(err){toast('Couldn’t apply: '+(err.message||'unknown error'));}
}
async function mapMeta(fn,msg){
 try{const r=await rpc('map_get',{p_party:G.code,p_pin:G.pin});const m=r.meta;if(!m||!m.cells){toast('No map yet.');return;}m.init=m.init||{on:false,order:[],turn:0,round:1};G.map=r;
  if(fn(m)===false)return;await rpc('map_save_meta',{p_party:G.code,p_pin:G.pin,p_meta:m});
  try{G.mchan.send({type:'broadcast',event:'reload',payload:{}});}catch(err){}
  if(msg)toast(msg,true);await loadMap();render();
 }catch(err){toast(err.message||'Couldn’t update the map.');}
}
async function sendPoll(){
 const D=G.pollDraft;const q=($('#pQ').value||'').trim();const opts=($('#pO').value||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,8);const free=$('#pF').checked;
 if(!q){toast('Write a question first.');return;}if(!D.to.length){toast('Pick at least one player.');return;}
 const group='p'+Date.now().toString(36)+uid().slice(0,3);
 try{await rpc('poll_send',{p_party:G.code,p_pin:G.pin,p_group:group,p_chars:D.to,p_data:{q,opts,free}});
  try{G.qchan.send({type:'broadcast',event:'poll',payload:{chars:D.to}});}catch(err){}
  G.pollDraft={to:[]};toast('Poll sent.',true);await loadPolls();render();
 }catch(err){toast(err.message||'Couldn’t send.');}
}
$('#lGo').onclick=()=>{const c=normCode($('#lCode').value);const p=$('#lPin').value;if(c.length<9){$('#lErr').textContent='Party codes look like VOID-7K3Q.';return;}if(p.length<4){$('#lErr').textContent='PINs are 4 or more characters.';return;}unlock(c,p);};
$('#lPin').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lGo').click();});
$('#lockBtn').onclick=()=>{lsSet('rtm.map.pin.'+G.code,null);location.reload();};
window.addEventListener('resize',()=>document.documentElement.style.setProperty('--hh',$('#hdr').offsetHeight+'px'));
(function init(){
 const code=normCode(lsGet('rtm.party.code'));const pin=code.length===9?lsGet('rtm.map.pin.'+code):null;
 if(code.length===9&&pin)unlock(code,pin).then(()=>{if(!G.data)relock();});
 else{relock();}
})();
</script>
