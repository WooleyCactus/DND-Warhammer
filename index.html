/* ---------- import ---------- */
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return;}const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s);});}
async function handleFile(file){
 if(!file)return;S.busy=true;S.msg=null;render();
 try{
  const name=file.name||'file';const ext=(name.split('.').pop()||'').toLowerCase();let src;
  if(ext==='pdf'||file.type==='application/pdf'){
   await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
   await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
   const data=new Uint8Array(await file.arrayBuffer());const r=await readPdfData(window.pdfjsLib,data);
   if(!r.fields.length&&!r.lines.length)throw new Error('This PDF has no readable text or form fields. If it is a scan or photo, enter the character with a blank sheet instead.');
   src=importPdf(r);if(!r.fields.length)src.warnings.unshift('This PDF has no form fields, so values were read from its text. Check every number.');
  }else if(['xlsx','xls','xlsm','csv'].includes(ext)){
   await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
   const wb=ext==='csv'?XLSX.read(await file.text(),{type:'string'}):XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:'array'});
   const sheets=wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}));
   src=importGrid(sheets);
  }else throw new Error(`"${name}" isn't a PDF or spreadsheet. Use a D&D Beyond PDF, .xlsx, .xls or .csv.`);
  S.draft={src,choices:{homeworld:'void',crewRole:'trader'},state:{}};S.draftFile=name;S.draftEditing=null;S.busy=false;go('review');
 }catch(e){S.busy=false;S.msg={err:true,text:e.message||String(e)};render();}
}

 if(a==='how'){const c=S.cur==='example'?exampleChar():cur();if(c)openHow(c,b.dataset.kind,b.dataset.kind==='atk'||b.dataset.kind==='dmg'||b.dataset.kind==='patk'||b.dataset.kind==='pdmg'?+b.dataset.k:b.dataset.k);return;}

 if(S.view==='build'&&a!=='go'&&buildClick(a,b.dataset.v,b))return;

 if(!ch)return;

 switch(a){

  case 'res':{const k=b.dataset.k,j=+b.dataset.j;st.res=st.res||{};const u2=st.res[k]||0;st.res[k]=j<u2?j:j+1;persist(ch);render();break;}
  case 'respool':{const k=b.dataset.k;const r=resources(ch,d).find(x=>x.k===k);st.res=st.res||{};st.res[k]=Math.max(0,Math.min(r.max,(st.res[k]||0)+(+b.dataset.d)));persist(ch);render();break;}
  case 'short':st.pact=0;st.res=st.res||{};resources(ch,d).forEach(r=>{if(r.reset==='short'||r.partial){st.res[r.k]=r.partial?Math.max(0,(st.res[r.k]||0)-1):0;}});st.raging=false;persist(ch);toastMsg('Short rest: pact slots restored. Spend hit dice by adjusting HP.');render();break;
  case 'long':st.hp=d.maxHp;st.temp=0;st.slots={};st.pact=0;st.ammo={};st.res={};st.raging=false;persist(ch);toastMsg('Long rest: wounds, slots and clips restored.');render();break;
  case 'perils':{const wis=d.mods.wis+(d.saves.find(x=>x.a==='wis').prof?d.pb:0);const r=1+Math.floor(Math.random()*20);const tot=r+wis;
   if(r!==1&&tot>=10){S.perils=`<b>Resisted.</b> Wis save ${r} ${sgn(wis)} = ${tot} against DC 10.`;pushRoll({label:'Perils save: resisted',total:tot,detail:`d20[${r}] ${sgn(wis)}`});}
   else{const p=1+Math.floor(Math.random()*20);const row=PERILS.find(x=>p>=x[0]&&p<=x[1]);S.perils=`<b style="color:var(--blood)">Failed</b> (Wis save ${tot}). Perils roll <span class="mono">${p}</span>: ${esc(row[2])}`;pushRoll({label:'Perils of the Warp',total:p,detail:row[2],fail:true});}
   render();break;}
 }
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(S.view==='build'){buildInput(t,false);return;}
 if(S.view==='levelup'){luInput(t,false);return;}
 if(S.view==='powers'&&t.dataset.pq){pqInput(t,S.pm,'q');return;}
 if(S.view==='review'&&t.dataset.f){
  let v=t.dataset.bool!=null?t.checked:t.value;if(t.dataset.num!=null)v=v===''?null:+v;
  if(t.dataset.f==='spellsText')S.draft.src.spells=String(v).split(/\n|,/).map(x=>x.trim()).filter(Boolean);else setPath(S.draft.src,t.dataset.f,v);
  if(t.dataset.f==='classes.0.cls'||t.dataset.rerender!=null){return;}
  const pv=$('#preview');if(pv)pv.innerHTML=previewHtml();
 }
 if(S.view==='sheet'&&t.dataset.st){const ch=cur();if(!ch)return;ch.state=ch.state||{};const k=t.dataset.st;ch.state[k]=k==='notes'?t.value:(t.value===''?0:+t.value);persist(ch);}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.how!=null&&S.how){const ad=S.how.addons[+t.dataset.how];ad.on=t.checked;if(ad.d20&&t.checked)S.how.addons.forEach(x=>{if(x!==ad&&x.d20&&x.d20!==ad.d20)x.on=false;});drawHow();return;}
 if(S.view==='build'&&(t.dataset.b||t.dataset.fp)){buildInput(t,true);return;}
 if(S.view==='levelup'&&t.dataset.fp){luInput(t,true);return;}
 if(t.dataset.c){
  if(S.view==='review'){S.draft.choices[t.dataset.c]=t.value;const pv=$('#preview');if(pv)pv.innerHTML=previewHtml();}
  else if(S.view==='sheet'){const ch=cur();if(ch){ch.choices=ch.choices||{};ch.choices[t.dataset.c]=t.value;persist(ch,true);render();}}
  return;}
 if(S.view==='review'&&t.dataset.f&&t.dataset.rerender!=null){
  setPath(S.draft.src,t.dataset.f,t.value);
  if(/^classes\.\d+\.cls$/.test(t.dataset.f)){setPath(S.draft.src,t.dataset.f.replace('cls','sub'),'');}
  render();return;}
 if(S.view==='review'&&t.dataset.f&&t.tagName==='SELECT'){setPath(S.draft.src,t.dataset.f,t.dataset.num!=null?+t.value:t.value);const pv=$('#preview');if(pv)pv.innerHTML=previewHtml();}
 if(S.view==='review'&&t.dataset.f==='race'){render();}
 if(t.id==='file')handleFile(t.files[0]);
 if(S.view==='sheet'&&t.dataset.st==='hp'){render();}
});
document.addEventListener('dragover',e=>{const dz=e.target.closest&&e.target.closest('#drop');if(dz){e.preventDefault();dz.classList.add('over');}});
document.addEventListener('dragleave',e=>{const dz=e.target.closest&&e.target.closest('#drop');if(dz)dz.classList.remove('over');});
document.addEventListener('drop',e=>{const dz=e.target.closest&&e.target.closest('#drop');if(!dz)return;e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)handleFile(f);});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.how){S.how=null;drawHow();}});
render();initStore();

</script>

</body>
</html>
