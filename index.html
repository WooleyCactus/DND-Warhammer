cage",7,"V","BKW","Action","100 feet","VSM (ruby dust worth 1,500+ GP,, which the spell consumes)","up to 1 hour",1,0,"An immobile, Invisible, Cube-shaped prison composed of magical force springs into existence around an area you choose within range. The prison can be a cage or a solid box, as you choose.\n  A prison in the shape of a cage can be up to 20 feet on a side and is made from 1/2-inch diameter bars spaced 1/2 inch apart. A prison in the shape of a box can be up to 10 feet on a side, creating a solid barrier that prevents any matter from passing through it and blocking any spells cast into or out from the area.\n  When you cast the spell, any creature that is completely inside the cage's area is trapped. Creatures only partially within the area, or those too large to fit inside it, are pushed away from the center of the area until they are completely outside it.\n  A creature inside the cage can't leave it by nonmagical means. If the creature tries to use teleportation or interplanar travel to leave, it must first make a Charisma saving throw. On a successful save, the creature can use that magic to exit the cage. On a failed save, the creature doesn't exit the cage and wastes the spell or effect. The cage also extends into the Ethereal Plane, blocking ethereal travel. This spell can't be dispelled by Dispel Magic.",""],["Magnificent Mansion",7,"C","BW","1 minute","300 feet","VSM (a miniature door worth 15+ GP)","24 hours",0,0,"You conjure a shimmering door in range that lasts for the duration. The door leads to an extradimensional dwelling and is 5 feet wide and 10 feet tall. You and any creature you designate when you cast the spell can enter the extradimensional dwelling as long as the door remains open. You can open or close it (no action required) if you are within 30 feet of it. While closed, the door is imperceptible.\n  Beyond the door is a magnificent foyer with numerous chambers beyond. The dwelling's atmosphere is clean, fresh, and warm.\n  You can create any floor plan you like for the dwelling, but it can't exceed 50 contiguous 10-foot Cubes. The place is furnished and decorated as you choose. It contains sufficient food to serve a ninecourse banquet for up to 100 people. Furnishings and other objects created by this spell dissipate into smoke if removed from it.\n  A staff of 100 near-transparent servants attends all who enter. You determine the appearance of these servants and their attire. They are invulnerable and obey your commands. Each servant can perform tasks that a human could perform, but they can't attack or take any action that would directly harm another creature. Thus the servants can fetch things, clean, mend, fold clothes, light fires, serve food, pour wine, and so on. The servants can't leave the dwelling.\n  When the spell ends, any creatures or objects left inside the extradimensional space are expelled into the unoccupied spaces nearest to the entrance.",""],["Mirage Arcane",7,"I","BDW","10 minutes","Sight","VS","10 days",0,0,"You make terrain in an area up to 1 mile square look, sound, smell, and even feel like some other sort of terrain. Open fields or a road could be made to resemble a swamp, hill, crevasse, or some other rough or impassable terrain. A pond can be made to seem like a grassy meadow, a precipice like a gentle slope, or a rock-strewn gully like a wide and smooth road.\n  Similarly, you can alter the appearance of structures or add them where none are present. The spell doesn't disguise, conceal, or add creatures.\n  The illusion includes audible, visual, tactile, and olfactory elements, so it can turn clear ground into Difficult Terrain (or vice versa) or otherwise impede movement through the area. Any piece of the illusory terrain (such as a rock or stick) that is removed from the spell's area disappears immediately.\n  Creatures with Truesight can see through the illusion to the terrain's true form; however, all other elements of the illusion remain, so while the creature is aware of the illusion's presence, the creature can still physically interact with the illusion.",""],["Plane Shift",7,"C","CDKSW","Action","Touch","VSM (a forked, metal rod worth 250+, GP and attuned to a plane of existence)","Instantaneous",0,0,"You and up to eight willing creatures who link hands in a circle are transported to a different plane of existence. You can specify a target destination in general terms, such as a specific city on the Elemental Plane of Fire or palace on the second level of the Nine Hells, and you appear in or near that destination, as determined by the GM.\n  Alternatively, if you know the sigil sequence of a teleportation circle on another plane of existence, this spell can take you to that circle. If the teleportation circle is too small to hold all the creatures you transported, they appear in the closest unoccupied spaces next to the circle.",""],["Prismatic Spray",7,"V","BSW","Action","Self","VS","Instantaneous",0,0,"Eight rays of light flash from you in a 60-foot Cone. Each creature in the Cone makes a Dexterity saving throw. For each target, roll 1d8 to determine which color ray affects it, consulting the Prismatic Rays table. Prismatic Rays 1d8 Ray 2    Orange. Failed Save: 12d6 Acid damage. Successful Save: Half as much damage. 4    Green. Failed Save: 12d6 Poison damage. Successful Save: Half as much damage. 1d8 Ray 6    Indigo. Failed Save: The target has the Restrained condition and makes a Constitution saving throw at the end of each of its turns. If it successfully saves three times, the condition ends. If it fails three times, it has the Petrified condition until it is freed by an effect like the Greater Restoration spell. The successes and failures needn't be consecutive; keep track of both until the target collects three of a kind. 8    Special. The target is struck by two rays. Roll twice, rerolling any 8.",""],["Project Image",7,"I","BW","Action","500 miles","VSM (a statuette of yourself worth, 5+ GP)","up to 1 day",1,0,"You create an illusory copy of yourself that lasts for the duration. The copy can appear at any location within range that you have seen before, regardless of intervening obstacles. The illusion looks and sounds like you, but it is intangible. If the illusion takes any damage, it disappears, and the spell ends.\n  You can see through the illusion's eyes and hear through its ears as if you were in its space. As a Magic action, you can move it up to 60 feet and make it gesture, speak, and behave in whatever way you choose. It mimics your mannerisms perfectly.\n  Physical interaction with the image reveals it to be illusory, since things can pass through it. A creature that takes the Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image, and any noise it makes sounds hollow to the creature.",""],["Regenerate",7,"T","BCD","1 minute","Touch","VSM (a prayer wheel)","1 hour",0,0,"A creature you touch regains 4d8 + 15 Hit Points. For the duration, the target regains 1 Hit Point at the start of each of its turns, and any severed body parts regrow after 2 minutes.",""],["Resurrection",7,"N","BC","1 hour","Touch","VSM (a diamond worth 1,000+ GP, which the spell consumes)","Instantaneous",0,0,"With a touch, you revive a dead creature that has been dead for no more than a century, didn't die of old age, and wasn't Undead when it died.\n  The creature returns to life with all its Hit Points. This spell also neutralizes any poisons that affected the creature at the time of death. This spell closes all mortal wounds and restores any missing body parts.\n  Coming back from the dead is an ordeal. The target takes a -4 penalty to D20 Tests. Every time the target finishes a Long Rest, the penalty is reduced by 1 until it becomes 0.\n  Casting this spell to revive a creature that has been dead for 365 days or longer taxes you. Until you finish a Long Rest, you can't cast spells again, and you have Disadvantage on D20 Tests.",""],["Reverse Gravity",7,"T","DSW","Action","100 feet","VSM (a lodestone and iron filings)","up to 1 minute",1,0,"This spell reverses gravity in a 50-foot-radius, 100foot high Cylinder centered on a point within range. All creatures and objects in that area that aren't anchored to the ground fall upward and reach the top of the Cylinder. A creature can make a Dexterity saving throw to grab a fixed object it can reach, thus avoiding the fall upward.\n  If a ceiling or an anchored object is encountered in this upward fall, creatures and objects strike it just as they would during a downward fall. If an affected creature or object reaches the Cylinder's top without striking anything, it hovers there for the duration. When the spell ends, affected objects and creatures fall downward.",""],["Sequester",7,"T","W","Action","Touch","VSM (gem dust worth 5,000+ GP,, which the spell consumes)","Until dispelled",0,0,"With a touch, you magically sequester an object or a willing creature. For the duration, the target has the Invisible condition and can't be targeted by Divination spells, detected by magic, or viewed remotely with magic.\n  If the target is a creature, it enters a state of suspended animation; it has the Unconscious condition, doesn't age, and doesn't need food, water, or air.\n  You can set a condition for the spell to end early. The condition can be anything you choose, but it must occur or be visible within 1 mile of the target. Examples include \"after 1,000 years\" or \"when the tarrasque awakens.\" This spell also ends if the target takes any damage.",""],["Simulacrum",7,"I","W","12 hours","Touch","VSM (powdered ruby worth 1,500+ GP,, which the spell consumes)","Until dispelled",0,0,"You create a simulacrum of one Beast or Humanoid that is within 10 feet of you for the entire casting of the spell. You finish the casting by touching both the creature and a pile of ice or snow that is the same size as that creature, and the pile turns into the simulacrum, which is a creature. It uses the game statistics of the original creature at the time of casting, except it is a Construct, its Hit Point maximum is half as much, and it can't cast this spell.\n  The simulacrum is Friendly to you and creatures you designate. It obeys your commands and acts on your turn in combat. The simulacrum can't gain levels, and it can't take Short or Long Rests.\n  If the simulacrum takes damage, the only way to restore its Hit Points is to repair it as you take a Long Rest, during which you expend components worth 100 GP per Hit Point restored. The simulacrum must stay within 5 feet of you for the repair.\n  The simulacrum lasts until it drops to 0 Hit Points, at which point it reverts to snow and melts away. If you cast this spell again, any simulacrum you created with this spell is instantly destroyed.",""],["Symbol",7,"A","BCDW","1 minute","Touch","VSM (powdered diamond worth 1,000+ GP, which the spell consumes)","Until dispelled or triggered",0,0,"You inscribe a harmful glyph either on a surface (such as a section of floor or wall) or within an object that can be closed (such as a book or chest). The glyph can cover an area no larger than 10 feet in diameter. If you choose an object, it must remain in place; if it is moved more than 10 feet from where you cast this spell, the glyph is broken, and the spell ends without being triggered.\n  The glyph is nearly imperceptible and requires a successful Wisdom (Perception) check against your spell save DC to notice.\n  When you inscribe the glyph, you set its trigger and choose which effect the symbol bears: Death, Discord, Fear, Pain, Sleep, or Stunning. Each one is explained below.\n  Set the Trigger. You decide what triggers the glyph when you cast the spell. For glyphs inscribed on a surface, common triggers include touching or stepping on the glyph, removing another object covering it, or approaching within a certain distance of it. For glyphs inscribed within an object, common triggers include opening that object or seeing the glyph.\n  You can refine the trigger so that only creatures of certain types activate it (for example, the glyph could be set to affect Aberrations). You can also set conditions for creatures that don't trigger the glyph, such as those who say a certain password.\n  Once triggered, the glyph glows, filling a 60-foot-radius Sphere with Dim Light for 10 minutes, after which time the spell ends. Each creature in the Sphere when the glyph activates is targeted by its effect, as is a creature that enters the Sphere for the first time on a turn or ends its turn there. A creature is targeted only once per turn.\n  Death. Each target makes a Constitution saving throw, taking 10d10 Necrotic damage on a failed save or half as much damage on a successful save.\n  Discord. Each target makes a Wisdom saving throw. On a failed save, a target argues with other creatures for 1 minute. During this time, it is incapable of meaningful communication and has Disadvantage on attack rolls and ability checks.\n  Fear. Each target must succeed on a Wisdom saving throw or have the Frightened condition for 1 minute. While Frightened, the target must move at least 30 feet away from the glyph on each of its turns, if able.\n  Pain. Each target must succeed on a Constitution saving throw or have the Incapacitated condition for 1 minute.\n  Sleep. Each target must succeed on a Wisdom saving throw or have the Unconscious condition for 10 minutes. A creature awakens if it takes damage or if someone takes an action to shake it awake.\n  Stunning. Each target must succeed on a Wisdom saving throw or have the Stunned condition for 1 minute.",""],["Teleport",7,"C","BSW","Action","10 feet","V","Instantaneous",0,0,"This spell instantly transports you and up to eight willing creatures that you can see within range, or a single object that you can see within range, to a destination you select. If you target an object, it must be Large or smaller, and it can't be held or carried by an unwilling creature.\n  The destination you choose must be known to you, and it must be on the same plane of existence as you. Your familiarity with the destination determines whether you arrive there successfully. The GM rolls 1d100 and consults the Teleportation Outcome table and the explanations after it. Teleportation  Outcome Familiarity Mishap Similar Area  Off Target\n  On Target Permanent circle 01-00 Linked object 01-00 Very familiar 01-05 06-13 14-24 25-00 Seen casually 01-33 34-43 44-53 54-00 Viewed once or described 01-43 44-53 54-73 74-00 False destination 01-50 51-00 -\n   Familiarity. Here are the meanings of the terms in the table's Familiarity column: • \"Permanent circle\" means a permanent teleportation circle whose sigil sequence you know. • \"Linked object\" means you possess an object taken from the desired destination within the last six months, such as a book from a wizard's library. • \"Very familiar\" is a place you have visited often, a place you have carefully studied, or a place you can see when you cast the spell. • \"Seen casually\" is a place you have seen more than once but with which you aren't very familiar. • \"Viewed once or described\" is a place you have seen once, possibly using magic, or a place you know through someone else's description, perhaps from a map. • \"False destination\" is a place that doesn't exist. Perhaps you tried to scry an enemy's sanctum but instead viewed an illusion, or you are attempting to teleport to a location that no longer exists.\n  Mishap. The spell's unpredictable magic results in a difficult journey. Each teleporting creature (or the target object) takes 3d10 Force damage, and the GM rerolls on the table to see where you wind up (multiple mishaps can occur, dealing damage each time).\n  Similar Area. You and your group (or the target object) appear in a different area that's visually or thematically similar to the target area. You appear in the closest similar place. If you are heading for your home laboratory, for example, you might appear in another person's laboratory in the same city.\n  Off Target. You and your group (or the target object) appear 2d12 miles away from the destination in a random direction. Roll 1d8 for the direction: 1, east; 2, southeast; 3, south; 4, southwest; 5, west; 6, northwest; 7, north; or 8, northeast.\n  On Target. You and your group (or the target object) appear where you intended.",""],["Animal Shapes",8,"T","D","Action","30 feet","VS","24 hours",0,0,"Choose any number of willing creatures that you can see within range. Each target shape-shifts into a Large or smaller Beast of your choice that has a Challenge Rating of 4 or lower. You can choose a different form for each target. On later turns, you can take a Magic action to transform the targets again.\n  A target's game statistics are replaced by the chosen Beast's statistics, but the target retains its creature type; Hit Points; Hit Point Dice; alignment; ability to communicate; and Intelligence, Wisdom, and Charisma scores. The target's actions are limited by the Beast form's anatomy, and it can't cast spells. The target's equipment melds into the new form, and the target can't use any of that equipment while in that form.\n  The target gains a number of Temporary Hit Points equal to the Hit Points of the first form into which it shape-shifts. These Temporary Hit Points vanish if any remain when the spell ends. The transformation lasts for the duration or until the target ends it as a Bonus Action.",""],["Antimagic Field",8,"A","CW","Action","Self","VSM (iron filings)","up to 1 hour",1,0,"An aura of antimagic surrounds you in 10-foot Emanation. No one can cast spells, take Magic actions, or create other magical effects inside the aura, and those things can't target or otherwise affect anything inside it. Magical properties of magic items don't work inside the aura or on anything inside it.\n  Areas of effect created by spells or other magic can't extend into the aura, and no one can teleport into or out of it or use planar travel there. Portals close temporarily while in the aura.\n  Ongoing spells, except those cast by an Artifact or a deity, are suppressed in the area. While an effect is suppressed, it doesn't function, but the time it spends suppressed counts against its duration.\n  Dispel Magic has no effect on the aura, and the auras created by different Antimagic Field spells don't nullify each other.",""],["Antipathy/Sympathy",8,"E","BDW","1 hour","60 feet","VSM (a mix of vinegar and honey)","10 days",0,0,"As you cast the spell, choose whether it creates antipathy or sympathy, and target one creature or object that is Huge or smaller. Then specify a kind of creature, such as red dragons, goblins, or vampires. A creature of the chosen kind makes a Wisdom saving throw when it comes within 120 feet of the target. Your choice of antipathy or sympathy determines what happens to a creature when it fails that save: Antipathy. The creature has the Frightened condition. The Frightened creature must use its movement on its turns to get as far away as possible from the target, moving by the safest route. Sympathy. The creature has the Charmed condition. The Charmed creature must use its movement on its turns to get as close as possible to the target, moving by the safest route. If the creature is within 5 feet of the target, the creature can't willingly move away. If the target damages the Charmed creature, that creature can make a Wisdom saving throw to end the effect, as described below.\n  Ending the Effect. If the Frightened or Charmed creature ends its turn more than 120 feet away from the target, the creature makes a Wisdom saving throw. On a successful save, the creature is no longer affected by the target. A creature that successfully saves against this effect is immune to it for 1 minute, after which it can be affected again.",""],["Befuddlement",8,"E","BDKW","Action","150 feet","VSM (a key ring with no keys)","Instantaneous",0,0,"You blast the mind of a creature that you can see within range. The target makes an Intelligence saving throw.\n  On a failed save, the target takes 10d12 Psychic damage and can't cast spells or take the Magic action. At the end of every 30 days, the target repeats the save, ending the effect on a success. The effect can also be ended by the Greater Restoration, Heal, or Wish spell.\n  On a successful save, the target takes half as much damage only.",""],["Clone",8,"N","W","1 hour","Touch","VSM (a diamond worth 1,000+ GP, which the spell consumes, and a sealable vessel worth 2,000+ GP that is large enough to hold the creature being cloned)","Instantaneous",0,0,"You touch a creature or at least 1 cubic inch of its flesh. An inert duplicate of that creature forms inside the vessel used in the spell's casting and finishes growing after 120 days; you choose whether the finished clone is the same age as the creature or younger. The clone remains inert and endures indefinitely while its vessel remains undisturbed.\n  If the original creature dies after the clone finishes forming, the creature's soul transfers to the clone if the soul is free and willing to return. The clone is physically identical to the original and has the same personality, memories, and abilities, but none of the original's equipment. The creature's original remains, if any, become inert and can't be revived, since the creature's soul is elsewhere.",""],["Control Weather",8,"T","CDW","10 minutes","Self","VSM (burning incense)","up to 8 hours",1,0,"You take control of the weather within 5 miles of you for the duration. You must be outdoors to cast this spell, and it ends early if you go indoors.\n  When you cast the spell, you change the current weather conditions, which are determined by the GM. You can change precipitation, temperature, and wind. It takes 1d4 × 10 minutes for the new",""],["Demiplane",8,"C","KSW","Action","60 feet","S","1 hour",0,0,"You create a shadowy Medium door on a flat solid surface that you can see within range. This door can be opened and closed, and it leads to a demiplane that is an empty room 30 feet in each dimension, made of wood or stone (your choice).\n  When the spell ends, the door vanishes, and any objects inside the demiplane remain there. Any creatures inside also remain unless they opt to be shunted through the door as it vanishes, landing with the Prone condition in the unoccupied spaces closest to the door's former space.\n  Each time you cast this spell, you can create a new demiplane or connect the shadowy door to a demiplane you created with a previous casting of this spell. Additionally, if you know the nature and contents of a demiplane created by a casting of this spell by another creature, you can connect the shadowy door to that demiplane instead.",""],["Dominate Monster",8,"E","BKSW","Action","60 feet","VS","up to 1 hour",1,0,"One creature you can see within range must succeed on a Wisdom saving throw or have the Charmed condition for the duration. The target has Advantage on the save if you or your allies are fighting it. Whenever the target takes damage, it repeats the save, ending the spell on itself on a success.\n  You have a telepathic link with the Charmed target while the two of you are on the same plane of existence. On your turn, you can use this link to issue commands to the target (no action required), such as \"Attack that creature,\" \"Move over there,\" or \"Fetch that object.\" The target does its best to obey on its turn. If it completes an order and doesn't receive further direction from you, it acts and moves as it likes, focusing on protecting itself.\n  You can command the target to take a Reaction but must take your own Reaction to do so.","Your Concentration can last longer with a level 9 spell slot (up to 8 hours)."],["Earthquake",8,"T","CDS","Action","500 feet","VSM (a fractured rock)","up to 1 minute",1,0,"Choose a point on the ground that you can see within range. For the duration, an intense tremor rips through the ground in a 100-foot-radius circle centered on that point. The ground there is Difficult Terrain.\n  When you cast this spell and at the end of each of your turns for the duration, each creature on the ground in the area makes a Dexterity saving throw. On a failed save, a creature has the Prone condition, and its Concentration is broken. You can also cause the effects below.\n  Fissures. A total of 1d6 fissures open in the spell's area at the end of the turn you cast it. You choose the fissures' locations, which can't be under structures. Each fissure is 1d10 × 10 feet deep and 10 feet wide, and it extends from one edge of the spell's area to another edge. A creature in the same space as a fissure must succeed on a Dexterity saving throw or fall in. A creature that successfully saves moves with the fissure's edge as it opens.\n  Structures. The tremor deals 50 Bludgeoning damage to any structure in contact with the ground in the area when you cast the spell and at the end of each of your turns until the spell ends. If a structure drops to 0 Hit Points, it collapses.\n  A creature within a distance from a collapsing structure equal to half the structure's height makes a Dexterity saving throw. On a failed save, the creature takes 12d6 Bludgeoning damage, has the Prone condition, and is buried in the rubble, requiring a DC 20 Strength (Athletics) check as an action to escape. On a successful save, the creature takes half as much damage only.",""],["Glibness",8,"E","BK","Action","Self","V","1 hour",0,0,"Until the spell ends, when you make a Charisma check, you can replace the number you roll with a 15. Additionally, no matter what you say, magic that would determine if you are telling the truth indicates that you are being truthful.",""],["Holy Aura",8,"A","C","Action","Self","VSM (a reliquary worth 1,000+ GP)","up to 1 minute",1,0,"For the duration, you emit an aura in a 30-foot Emanation. While in the aura, creatures of your choice have Advantage on all saving throws, and other creatures have Disadvantage on attack rolls against them. In addition, when a Fiend or an Undead hits an affected creature with a melee attack roll, the attacker must succeed on a Constitution saving throw or have the Blinded condition until the end of its next turn.",""],["Incendiary Cloud",8,"C","DSW","Action","150 feet","VS","up to 1 minute",1,0,"A swirling cloud of embers and smoke fills a 20-foot-radius Sphere centered on a point within range. The cloud's area is Heavily Obscured. It lasts for the duration or until a strong wind (like that created by Gust of Wind) disperses it.\n  When the cloud appears, each creature in it makes a Dexterity saving throw, taking 10d8 Fire damage on a failed save or half as much damage on a successful one. A creature must also make this save when the Sphere moves into its space and when it enters the Sphere or ends its turn there. A creature makes this save only once per turn.\n  The cloud moves 10 feet away from you in a direction you choose at the start of each of your turns.",""],["Maze",8,"C","W","Action","60 feet","VS","up to 10 minutes",1,0,"You banish a creature that you can see within range into a labyrinthine demiplane. The target remains there for the duration or until it escapes the maze.\n  The target can take a Study action to try to escape. When it does so, it makes a DC 20 Intelligence (Investigation) check. If it succeeds, it escapes, and the spell ends.\n   When the spell ends, the target reappears in the space it left or, if that space is occupied, in the nearest unoccupied space.",""],["Mind Blank",8,"A","BW","Action","Touch","VS","24 hours",0,0,"Until the spell ends, one willing creature you touch has Immunity to Psychic damage and the Charmed condition. The target is also unaffected by anything that would sense its emotions or alignment, read its thoughts, or magically detect its location, and no spell-not even Wish-can gather information about the target, observe it remotely, or control its mind.",""],["Power Word Stun",8,"E","BKSW","Action","60 feet","V","Instantaneous",0,0,"You overwhelm the mind of one creature you can see within range. If the target has 150 Hit Points or fewer, it has the Stunned condition. Otherwise, its Speed is 0 until the start of your next turn.\n  The Stunned target makes a Constitution saving throw at the end of each of its turns, ending the condition on itself on a success.",""],["Sunburst",8,"V","CDSW","Action","150 feet","VSM (a piece of sunstone)","Instantaneous",0,0,"Brilliant sunlight flashes in a 60-foot-radius Sphere centered on a point you choose within range. Each creature in the Sphere makes a Constitution saving throw. On a failed save, a creature takes 12d6 Radiant damage and has the Blinded condition for 1 minute. On a successful save, it takes half as much damage only.\n  A creature Blinded by this spell makes another Constitution saving throw at the end of each of its turns, ending the effect on itself on a success.\n  This spell dispels Darkness in its area that was created by any spell.",""],["Tsunami",8,"C","D","1 minute","1 mile","VS","up to 6 rounds",1,0,"A wall of water springs into existence at a point you choose within range. You can make the wall up to 300 feet long, 300 feet high, and 50 feet thick. The wall lasts for the duration.\n  When the wall appears, each creature in its area makes a Strength saving throw, taking 6d10 Bludgeoning damage on a failed save or half as much damage on a successful one.\n  At the start of each of your turns after the wall appears, the wall, along with any creatures in it, moves 50 feet away from you. Any Huge or smaller creature inside the wall or whose space the wall enters when it moves must succeed on a Strength saving throw or take 5d10 Bludgeoning damage. A creature can take this damage only once per round. At the end of the turn, the wall's height is reduced by 50 feet, and the damage the wall deals on later rounds is reduced by 1d10. When the wall reaches 0 feet in height, the spell ends.\n  A creature caught in the wall can move by swimming. Because of the wave's force, though, the creature must succeed on a Strength (Athletics) check against your spell save DC to move at all. If it fails the check, it can't move. A creature that moves out of the wall falls to the ground.",""],["Astral Projection",9,"N","CKW","1 hour","10 feet","VSM (for each of the spell's targets, one jacinth worth 1,000+ GP and one silver bar worth 100+ GP, all of which the spell consumes)","Until dispelled",0,0,"You and up to eight willing creatures within range project your astral bodies into the Astral Plane (the spell ends instantly if you are already on that plane). Each target's body is left behind in a state of suspended animation; it has the Unconscious condition, doesn't need food or air, and doesn't age.\n  A target's astral form resembles its body in almost every way, replicating its game statistics and possessions. The principal difference is the addition of a silvery cord that trails from between the shoulder blades of the astral form. The cord fades from view after 1 foot. If the cord is cut-which happens only when an effect states that it does so-the target's body and astral form both die.\n  A target's astral form can travel through the Astral Plane. The moment an astral form leaves that plane, the target's body and possessions travel along the silver cord, causing the target to re-enter its body on the new plane.\n  Any damage or other effects that apply to an astral form have no effect on the target's body and vice versa. If a target's body or astral form drops to 0 Hit Points, the spell ends for that target. The spell ends for all the targets if you take a Magic action to dismiss it.\n   When the spell ends for a target who isn't dead, the target reappears in its body and exits the state of suspended animation.",""],["Foresight",9,"D","BDKW","1 minute","Touch","VSM (a hummingbird feather)","8 hours",0,0,"You touch a willing creature and bestow a limited ability to see into the immediate future. For the duration, the target has Advantage on D20 Tests, and other creatures have Disadvantage on attack rolls against it. The spell ends early if you cast it again.",""],["Gate",9,"C","CKSW","Action","60 feet","VSM (a diamond worth 5,000+ GP)","up to 1 minute",1,0,"You conjure a portal linking an unoccupied space you can see within range to a precise location on a different plane of existence. The portal is a circular opening, which you can make 5 to 20 feet in diameter. You can orient the portal in any direction you choose. The portal lasts for the duration, and the portal's destination is visible through it.\n  The portal has a front and a back on each plane where it appears. Travel through the portal is possible only by moving through its front. Anything that does so is instantly transported to the other plane, appearing in the unoccupied space nearest to the portal.\n  Deities and other planar rulers can prevent portals created by this spell from opening in their presence or anywhere within their domains.\n  When you cast this spell, you can speak the name of a specific creature (a pseudonym, title, or nickname doesn't work). If that creature is on a plane other than the one you are on, the portal opens next to the named creature and transports it to the nearest unoccupied space on your side of the portal. You gain no special power over the creature, and it is free to act as the GM deems appropriate. It might leave, attack you, or help you.",""],["Imprisonment",9,"A","KW","1 minute","30 feet","VSM (a statuette of the target worth, 5,000+ GP)","Until dispelled",0,0,"You create a magical restraint to hold a creature that you can see within range. The target must make a Wisdom saving throw. On a successful save, the target is unaffected, and it is immune to this spell for the next 24 hours. On a failed save, the target is imprisoned. While imprisoned, the target doesn't need to breathe, eat, or drink, and it doesn't age. Divination spells can't locate or perceive the imprisoned target, and the target can't teleport.\n  Until the spell ends, the target is also affected by one of the following effects of your choice: Burial. The target is entombed beneath the earth in a hollow globe of magical force that is just large enough to contain the target. Nothing can pass into or out of the globe. Chaining. Chains firmly rooted in the ground hold the target in place. The target has the Restrained condition and can't be moved by any means. Hedged Prison. The target is trapped in a demiplane that is warded against teleportation and planar travel. The demiplane is your choice of a labyrinth, a cage, a tower, or the like. Minimus Containment. The target becomes 1 inch tall and is trapped inside an indestructible gemstone or a similar object. Light can pass through the gemstone (allowing the target to see out and other creatures to see in), but nothing else can pass through by any means. Slumber. The target has the Unconscious condition and can't be awoken.\n  Ending the Spell. When you cast the spell, specify a trigger that will end it. The trigger can be as simple or as elaborate as you choose, but the GM must agree that it has a high likelihood of happening within the next decade. The trigger must be an observable action, such as someone making a particular offering at the temple of your god, saving your true love, or defeating a specific monster.\n  A Dispel Magic spell can end the spell only if it is cast with a level 9 spell slot, targeting either the prison or the component used to create it.",""],["Mass Heal",9,"A","C","Action","60 feet","VS","Instantaneous",0,0,"A flood of healing energy flows from you into creatures around you. You restore up to 700 Hit Points, divided as you choose among any number of creatures that you can see within range. Creatures healed by this spell also have the Blinded, Deafened, and Poisoned conditions removed from them.",""],["Meteor Swarm",9,"V","SW","Action","1 mile","VS","Instantaneous",0,0,"Blazing orbs of fire plummet to the ground at four different points you can see within range. Each creature in a 40-foot-radius Sphere centered on each of those points makes a Dexterity saving throw. A creature takes 20d6 Fire damage and 20d6 Bludgeoning damage on a failed save or half as much damage on a successful one. A creature in the area of more than one fiery Sphere is affected only once.\n  A nonmagical object that isn't being worn or carried also takes the damage if it's in the spell's area, and the object starts burning if it's flammable.",""],["Power Word Heal",9,"E","BC","Action","60 feet Component: V","","Instantaneous",0,0,"A wave of healing energy washes over one creature you can see within range. The target regains all its Hit Points. If the creature has the Charmed, Frightened, Paralyzed, Poisoned, or Stunned condition, the condition ends. If the creature has the Prone condition, it can use its Reaction to stand up.",""],["Power Word Kill",9,"E","BKSW","Action","60 feet Component: V","","Instantaneous",0,0,"You compel one creature you can see within range to die. If the target has 100 Hit Points or fewer, it dies. Otherwise, it takes 12d12 Psychic damage.",""],["Prismatic Wall",9,"A","BW","Action","60 feet","VS","10 minutes",0,0,"A shimmering, multicolored plane of light forms a vertical opaque wall-up to 90 feet long, 30 feet high, and 1 inch thick-centered on a point within range. Alternatively, you shape the wall into a globe up to 30 feet in diameter centered on a point within range. The wall lasts for the duration. If you position the wall in a space occupied by a creature, the spell ends instantly without effect.\n  The wall sheds Bright Light within 100 feet and Dim Light for an additional 100 feet. You and creatures you designate when you cast the spell can pass through and be near the wall without harm. If another creature that can see the wall moves within 20 feet of it or starts its turn there, the creature must succeed on a Constitution saving throw or have the Blinded condition for 1 minute.\n  The wall consists of seven layers, each with a different color. When a creature reaches into or passes through the wall, it does so one layer at a time through all the layers. Each layer forces the creature to make a Dexterity saving throw or be affected by that layer's properties as described in the Prismatic Layers table.\n  The wall, which has AC 10, can be destroyed one layer at a time, in order from red to violet, by means specific to each layer. If a layer is destroyed, it is gone for the duration. Antimagic Field has no effect on the wall, and Dispel Magic can affect only the violet layer. Prismatic Layers Order  Effects 2    Orange. Failed Save: 12d6 Acid damage. Successful Save: Half as much damage. Additional Effects: Magical ranged attacks can't pass through this layer, which is destroyed by a strong wind (such as the one created by Gust of Wind). 4    Green. Failed Save: 12d6 Poison damage. Successful Save: Half as much damage. Additional Effects: A Passwall spell, or another spell of equal or greater level that can open a portal on a solid surface, destroys this layer. 6    Indigo. Failed Save: The target has the Restrained condition and makes a Constitution saving throw at the end of each of its turns. If it successfully saves three times, the condition ends. If it fails three times, it has the Petrified condition until it is freed by an effect like the Greater Restoration spell. The successes and failures needn't be consecutive; keep track of both until the target collects three of a kind. Additional Effects: Spells can't be cast through this layer, which is destroyed by Bright Light shed by the Daylight spell.",""],["Shapechange",9,"T","DW","Action","Self","VSM (a jade circlet worth 1,500+ GP)","up to 1 hour",1,0,"You shape-shift into another creature for the duration or until you take a Magic action to shape-shift into a different eligible form. The new form must be of a creature that has a Challenge Rating no higher than your level or Challenge Rating. You must have seen the sort of creature before, and it can't be a Construct or an Undead.\n  When you cast the spell, you gain a number of Temporary Hit Points equal to the Hit Points of the first form into which you shape-shift. These Temporary Hit Points vanish if any remain when the spell ends.\n  Your game statistics are replaced by the stat block of the chosen form, but you retain your creature type; alignment; personality; Intelligence, Wisdom, and Charisma scores; Hit Points; Hit Point Dice; proficiencies; and ability to communicate. If you have the Spellcasting feature, you retain it too.\n  Upon shape-shifting, you determine whether your equipment drops to the ground or changes in size and shape to fit the new form while you're in it.",""],["Storm of Vengeance",9,"C","D","Action","1 mile","VS","up to 1 minute",1,0,"A churning storm cloud forms for the duration, centered on a point within range and spreading to a radius of 300 feet. Each creature under the cloud when it appears must succeed on a Constitution saving throw or take 2d6 Thunder damage and have the Deafened condition for the duration.\n  At the start of each of your later turns, the storm produces different effects, as detailed below.\n  Turn 2. Acidic rain falls. Each creature and object under the cloud takes 4d6 Acid damage.\n  Turn 3. You call six bolts of lightning from the cloud to strike six different creatures or objects beneath it. Each target makes a Dexterity saving throw, taking 10d6 Lightning damage on a failed save or half as much damage on a successful one.\n  Turn 4. Hailstones rain down. Each creature under the cloud takes 2d6 Bludgeoning damage.\n  Turns 5-10. Gusts and freezing rain assail the area under the cloud. Each creature there takes 1d6 Cold damage. Until the spell ends, the area is Difficult Terrain and Heavily Obscured, ranged attacks with weapons are impossible there, and strong wind blows through the area.",""],["Time Stop",9,"T","SW","Action","Self","V","Instantaneous",0,0,"You briefly stop the flow of time for everyone but yourself. No time passes for other creatures, while you take 1d4 + 1 turns in a row, during which you can use actions and move as normal.\n  This spell ends if one of the actions you use during this period, or any effects that you create during it, affects a creature other than you or an object being worn or carried by someone other than you. In addition, the spell ends if you move to a place more than 1,000 feet from the location where you cast it.",""],["True Polymorph",9,"T","BKW","Action","30 feet","VSM (a drop of mercury, a dollop of gum arabic, and a wisp of smoke)","up to 1 hour",1,0,"Choose one creature or nonmagical object that you can see within range. The creature shape-shifts into a different creature or a nonmagical object, or the object shape-shifts into a creature (the object must be neither worn nor carried). The transformation lasts for the duration or until the target dies or is destroyed, but if you maintain Concentration on this spell for the full duration, the spell lasts until dispelled.\n   An unwilling creature can make a Wisdom saving throw, and if it succeeds, it isn't affected by this spell.\n  Creature into Creature. If you turn a creature into another kind of creature, the new form can be any kind you choose that has a Challenge Rating equal to or less than the target's Challenge Rating or level. The target's game statistics are replaced by the stat block of the new form, but it retains its Hit Points, Hit Point Dice, alignment, and personality.\n  The target gains a number of Temporary Hit Points equal to the Hit Points of the new form. These Temporary Hit Points vanish if any remain when the spell ends.\n  The target is limited in the actions it can perform by the anatomy of its new form, and it can't speak or cast spells.\n  The target's gear melds into the new form. The creature can't use or otherwise benefit from any of that equipment.\n  Object into Creature. You can turn an object into any kind of creature, as long as the creature's size is no larger than the object's size and the creature has a Challenge Rating of 9 or lower. The creature is Friendly to you and your allies. In combat, it takes its turns immediately after yours, and it obeys your commands.\n  If the spell lasts more than an hour, you no longer control the creature. It might remain Friendly to you, depending on how you have treated it.\n  Creature into Object. If you turn a creature into an object, it transforms along with whatever it is wearing and carrying into that form, as long as the object's size is no larger than the creature's size. The creature's statistics become those of the object, and the creature has no memory of time spent in this form after the spell ends and it returns to normal.",""],["True Resurrection",9,"N","CD","1 hour","Touch","VSM (diamonds worth 25,000+ GP,, which the spell consumes)","Instantaneous",0,0,"You touch a creature that has been dead for no longer than 200 years and that died for any reason except old age. The creature is revived with all its Hit Points.\n  This spell closes all wounds, neutralizes any poison, cures all magical contagions, and lifts any curses affecting the creature when it died. The spell replaces damaged or missing organs and limbs. If the creature was Undead, it is restored to its non-Undead form.\n  The spell can provide a new body if the original no longer exists, in which case you must speak the creature's name. The creature then appears in an unoccupied space you choose within 10 feet of you.",""],["Weird",9,"I","KW","Action","120 feet","VS","up to 1 minute",1,0,"You try to create illusory terrors in others' minds. Each creature of your choice in a 30-foot-radius Sphere centered on a point within range makes a Wisdom saving throw. On a failed save, a target takes 10d10 Psychic damage and has the Frightened condition for the duration. On a successful save, a target takes half as much damage only.\n   A Frightened target makes a Wisdom saving throw at the end of each of its turns. On a failed save, it takes 5d10 Psychic damage. On a successful save, the spell ends on that target.",""],["Wish",9,"C","SW","Action","Self","V","Instantaneous",0,0,"Wish is the mightiest spell a mortal can cast. By simply speaking aloud, you can alter reality itself.\n  The basic use of this spell is to duplicate any other spell of level 8 or lower. If you use it this way, you don't need to meet any requirements to cast that spell, including costly components. The spell simply takes effect.\n  Alternatively, you can create one of the following effects of your choice: Object Creation. You create one object of up to 25,000 GP in value that isn't a magic item. The object can be no more than 300 feet in any dimension, and it appears in an unoccupied space that you can see on the ground. Instant Health. You allow yourself and up to twenty creatures that you can see to regain all Hit Points, and you end all effects on them listed in the Greater Restoration spell. Resistance. You grant up to ten creatures that you can see Resistance to one damage type that you choose. This Resistance is permanent. Spell Immunity. You grant up to ten creatures you can see immunity to a single spell or other magical effect for 8 hours. Sudden Learning. You replace one of your feats with another feat for which you are eligible. You lose all the benefits of the old feat and gain the benefits of the new one. You can't replace a feat that is a prerequisite for any of your other feats or features. Roll Redo. You undo a single recent event by forcing a reroll of any die roll made within the last round (including your last turn). Reality reshapes itself to accommodate the new result. For example, a Wish spell could undo an ally's failed saving throw or a foe's Critical Hit. You can force the reroll to be made with Advantage or Disadvantage, and you choose whether to use the reroll or the original roll. Reshape Reality. You may wish for something not included in any of the other effects. To do so, state your wish to the GM as precisely as possible. The GM has great latitude in ruling what occurs in such an instance; the greater the wish, the greater the likelihood that something goes wrong. This spell might simply fail, the effect you desire might be achieved only in part, or you might suffer an unforeseen consequence as a result of how you worded the wish. For example, wishing that a villain were dead might propel you forward in time to a period when that villain is no longer alive, effectively removing you from the game. Similarly, wishing for a Legendary magic item or an Artifact might instantly transport you to the presence of the item's current owner. If your wish is granted and its effects have consequences for a whole community, region, or world, you are likely to attract powerful foes. If your wish would affect a god, the god's divine servants might instantly intervene to prevent it or to encourage you to craft the wish in a particular way. If your wish would undo the multiverse itself, your wish fails. The stress of casting Wish to produce any effect other than duplicating another spell weakens you. After enduring that stress, each time you cast a spell until you finish a Long Rest, you take 1d10 Necrotic damage per level of that spell. This damage can't be reduced or prevented in any way. In addition, your Strength score becomes 3 for 2d4 days. For each of those days that you spend resting and doing nothing more than light activity, your remaining recovery time decreases by 2 days. Finally, there is a 33 percent chance that you are unable to cast Wish ever again if you suffer this stress.",""]];

/* ===== SRD 5.2 spells, feats, fighting styles, level-up rules ===== */
const SPELL_INFO={};
(function(){
 const CK={B:'bard',C:'cleric',D:'druid',P:'paladin',R:'ranger',S:'sorcerer',K:'warlock',W:'wizard'};
 const lists={};Object.values(CK).forEach(c=>lists[c]=[[],[],[],[],[],[],[],[],[],[]]);
 for(const [name,lvl,school,cls,time,range,comp,dur,conc,rit,desc,higher] of SRD_SPELLS){
  const k=N(name);if(!SPELLS[k])SPELLS[k]={name,lvl,school};
  const canon=SPELLS[k].name;
  SPELL_INFO[N(canon)]={name:canon,srdName:name,lvl,school,time,range,comp,dur,conc:!!conc,ritual:!!rit,desc,higher};
  for(const ch of cls)lists[CK[ch]][lvl].push(canon);
 }
 Object.keys(lists).forEach(c=>{lists[c].forEach(a=>a.sort());CLASS_SPELLS[c]=lists[c];});
})();
const SPELL_WORDS={psyker:['power','powers','manifest'],faith:['prayer','prayers','invoke'],tech:['rite','rites','activate']};
function spellText(name,trad,field){
 const info=SPELL_INFO[N(name)];if(!info)return '';
 let t=String(info[field||'desc']||'');const w=SPELL_WORDS[trad]||SPELL_WORDS.psyker;
 t=t.replace(/\*\*([^*]+)\*\*/g,'$1').replace(/_([^_]+)_/g,'$1');
 for(const n of Object.values(SPELLS)){if(n.name.length<5)continue;const r=spell40k(n.name,trad);if(r.curated&&r.name40k!==n.name&&t.includes(n.name))t=t.split(n.name).join(r.name40k);}
 t=t.replace(/\bspell slots?\b/gi,m=>matchCase(m,m.toLowerCase().endsWith('s')?w[0]+' slots':w[0]+' slot'))
  .replace(/\bspellcasting ability\b/gi,'casting characteristic')
  .replace(/\bspell attacks?\b/gi,m=>matchCase(m,m.toLowerCase().endsWith('s')?w[0]+' attacks':w[0]+' attack'))
  .replace(/\bthis spell\b/gi,m=>matchCase(m,'this '+w[0])).replace(/\bthe spell\b/gi,m=>matchCase(m,'the '+w[0]))
  .replace(/\bspells\b/gi,m=>matchCase(m,w[1])).replace(/\bspell\b/gi,m=>matchCase(m,w[0]))
  .replace(/\bcantrip\b/gi,m=>matchCase(m,'minor '+w[0]));
 t=t.replace(/Using a Higher-Level [^.]*?[Ss]lot\.\s*/g,'With a higher slot: ').replace(/Cantrip Upgrade\.\s*/g,'As you advance: ');
 return reskinText(t);
}
function compText(comp,trad){
 const m=String(comp||'').match(/^([VSM]+)(?:\s*\((.*)\))?$/);if(!m)return comp;
 const parts=[];if(m[1].includes('V'))parts.push(trad==='tech'?'binaric cant':trad==='faith'?'spoken litany':'spoken word');
 if(m[1].includes('S'))parts.push('gesture');if(m[1].includes('M'))parts.push(m[2]?`focus: ${reskinText(m[2])}`:'focus');return parts.join(', ');
}

function styleLevel(cls){return cls==='fighter'?1:(cls==='paladin'||cls==='ranger')?2:99;}
function featLevels(cls,level){const base=[4,8,12,16,19];if(cls==='fighter')base.push(6,14);if(cls==='rogue')base.push(10);return base.filter(l=>l<=level).sort((a,b)=>a-b);}
function featBonus(pick){const o={};if(!pick)return o;if(pick.type==='asi'){if(pick.a1)o[pick.a1]=(o[pick.a1]||0)+(pick.a2&&pick.a2!==pick.a1?1:2);if(pick.a2&&pick.a2!==pick.a1)o[pick.a2]=(o[pick.a2]||0)+1;}else if(pick.type==='feat'&&pick.abil)o[pick.abil]=1;return o;}
function featLabel(pick){if(!pick)return '';if(pick.type==='asi'){const b=featBonus(pick);return 'Characteristic Advance ('+Object.entries(b).map(([a,v])=>`${a.toUpperCase()} +${v}`).join(', ')+')';}const F=FEATS[pick.key];return F?`${F.w40} (${F.name})${pick.abil?` · ${pick.abil.toUpperCase()} +1`:''}`:'';}
function featRecord(pick,level){if(!pick)return null;if(pick.type==='asi')return {level,key:'asi',name:'Ability Score Improvement',w40:'Characteristic Advance',text:featLabel(pick)};const F=FEATS[pick.key];if(!F)return null;return {level,key:pick.key,name:F.name,w40:F.w40,text:F.text+(pick.abil?` (${pick.abil.toUpperCase()} +1)`:''),abil:pick.abil||null};}
function spellbookSize(level){return 6+2*(Math.max(1,level)-1);}
function spellLimits(cls,level,sub,opts){
 const ob=typeof orderCantripBonus==='function'?orderCantripBonus(cls,opts):0;
 if(cls==='wizard'){const c=castCounts('wizard',level);return {cantrips:c.cantrips,spells:spellbookSize(level),label:'Spellbook'};}
 if((cls==='fighter'&&sub==='Eldritch Knight')||(cls==='rogue'&&sub==='Arcane Trickster')){const c=castCounts('third',level);return {...c,label:'Powers known'};}
 const c=castCounts(cls,level);return {...c,cantrips:c.cantrips+ob,label:'Prepared powers'};
}
function spellListFor(cls,sub){if(!CLASSES[cls])return null;if(CLASSES[cls].caster)return cls;if(sub==='Eldritch Knight'||sub==='Arcane Trickster')return 'wizard';return null;}
function maxPowerLevel(cls,level,sub){if(CLASSES[cls].caster)return maxSpellLevel(cls,level);if(sub==='Eldritch Knight'||sub==='Arcane Trickster')return level<3?0:SLOTS[Math.max(1,Math.ceil(level/3))].length;return 0;}

function classOptionGroups(cls,level,sub,opts,cantrips){
 const g=[];if(ORDERS[cls])g.push({id:'order',label:ORDERS[cls].label,single:true,max:1});
 const mc=masteryCount(cls,level);if(mc)g.push({id:'masteries',label:'Weapon Mastery',max:mc});
 if(cls==='warlock'){const n=invocCount(level);if(n)g.push({id:'invocations',label:'Warp Invocations',max:n});}
 if(cls==='sorcerer'){const n=metaCount(level);if(n)g.push({id:'metamagic',label:'Warp Shaping (Metamagic)',max:n});}
 if(cls==='fighter'&&sub==='Battle Master'){const n=manCount(level);if(n)g.push({id:'maneuvers',label:'Manoeuvres',max:n});}
 return g;
}
function invocOK(k,level,opts,cantrips){const v=INVOC[k];if(level<v[2])return false;const req=v[3];if(!req)return true;
 if(req==='cantrip')return (cantrips||[]).some(n=>{const i=SPELL_INFO[N(n)];return i&&i.lvl===0&&/damage/i.test(i.desc)&&(CLASS_SPELLS.warlock[0]||[]).includes(n);});
 return (opts.invocations||[]).includes(req);}
function trimOpts(cls,level,sub,opts,cantrips){
 opts=opts||{};const out={order:ORDERS[cls]?opts.order||'':'',masteries:[],invocations:[],metamagic:[],maneuvers:[]};
 for(const gp of classOptionGroups(cls,level,sub,opts,cantrips)){if(gp.id==='order')continue;let arr=(opts[gp.id]||[]).slice(0,gp.max);
  if(gp.id==='invocations')arr=arr.filter(k=>INVOC[k]&&invocOK(k,level,{invocations:arr},cantrips));out[gp.id]=arr;}
 return out;
}

function classOptionsUI(ctx,cls,level,sub,opts,cantrips){
 const groups=classOptionGroups(cls,level,sub,opts,cantrips);if(!groups.length)return '<p class="muted">No extra choices for this career at this level.</p>';
 return groups.map(gp=>{
  if(gp.id==='order'){const O=ORDERS[cls];return `<h3 class="sub-h">${esc(O.label)}</h3><div class="picks">${Object.entries(O.opts).map(([k,o])=>bCard(opts.order===k,ctx+'-opt',k,esc(o[1]),esc(o[0]),esc(o[2])).replace('data-act=',`data-g="order" data-act=`)).join('')}</div>`;}
  const have=opts[gp.id]||[];const left=gp.max-have.length;
  const head=`<h3 class="sub-h">${esc(gp.label)}: choose ${gp.max} <span class="count ${left>0?'':'ok'}">${left>0?left+' left':'done'}</span></h3>`;
  const row=(k,t40,t5,txt,dis,extra)=>{const on=have.includes(k);return `<div class="opt${on?' on':''}"><button class="sp-add" data-act="${ctx}-opt" data-g="${gp.id}" data-v="${k}" aria-pressed="${on}" ${!on&&(left<=0||dis)?'disabled':''}>${on?'✓':'+'}</button><div><b>${esc(t40)}</b> <small class="muted">${esc(t5)}${extra?' · '+esc(extra):''}</small><div class="opt-t">${esc(txt)}</div></div></div>`;};
  let rows='';
  if(gp.id==='masteries'){const kinds=MASTERY_KINDS.filter(m=>cls!=='barbarian'||!m.ranged);rows=kinds.map(m=>row(m.key,m.to,m.name5e,`${m.prop}: ${reskinText(MASTERY_PROPS[m.prop]||'')}`,false)).join('');}
  if(gp.id==='invocations')rows=Object.entries(INVOC).map(([k,v])=>{const ok=invocOK(k,level,opts,cantrips);const why=level<v[2]?`warlock level ${v[2]}`:v[3]==='cantrip'?'needs a damaging warlock cantrip':v[3]?`needs ${INVOC[v[3]][1]}`:'';return row(k,v[1],v[0],v[4],!ok,ok?'':why);}).join('');
  if(gp.id==='metamagic')rows=Object.entries(META).map(([k,v])=>row(k,v[1],v[0],v[3],false,`${v[2]} Warp Point${v[2]>1?'s':''}`)).join('');
  if(gp.id==='maneuvers'){const s=superiority(level);rows=`<p class="note" style="margin-top:0">${s.dice} superiority dice (d${s.size}), regained on a short or long rest.</p>`+Object.entries(MANEUVERS).map(([k,v])=>row(k,v[1],v[0],v[2],false)).join('');}
  return head+`<div class="opts">${rows}</div>`;
 }).join('');
}
function toggleOpt(opts,g,k,cls,level,sub,cantrips){

 if(arr.length>=gp.max){toastMsg('That count is full. Remove one first.');return;}arr.push(k);
}

}

/* ===== Power picker: readable rows, expandable effects, hard limits ===== */
function schoolName(x){return x&&SCHOOL[x]?SCHOOL[x]:'';}
function powerMeta(name,trad){
 const sp=SPELLS[N(name)];const info=SPELL_INFO[N(name)];const r=spell40k(name,trad);
 const lvl=sp?sp.lvl:null;
 return {name,r,lvl,info,disc:sp?DISCIPLINE[trad][sp.school]:'',perils:trad==='psyker'&&lvl>0};
}
function powerSummary(m){
 const bits=[];if(m.info){bits.push(m.info.time);bits.push(m.info.range);bits.push((m.info.conc?'Concentration, ':'')+m.info.dur);}
 return bits.filter(Boolean).join(' · ');
}
function powerBody(name,trad){
 const info=SPELL_INFO[N(name)];const m=powerMeta(name,trad);
 if(!info)return `<p class="muted">No rules text on file for ${esc(name)} (it isn't in the 2024 SRD). Check the book it came from.</p>`;
 const paras=spellText(name,trad).split(/\n+/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');
 return `<dl class="sp-facts"><dt>Casting time</dt><dd>${esc(info.time)}${info.ritual?' (ritual)':''}</dd><dt>Range</dt><dd>${esc(info.range)}</dd><dt>Duration</dt><dd>${info.conc?'Concentration, ':''}${esc(info.dur)}</dd><dt>Needs</dt><dd>${esc(compText(info.comp,trad))}</dd></dl>
 ${paras}${info.higher&&!/Higher-Level|Cantrip Upgrade/.test(info.desc)?`<p><b>${trad==='tech'?'Overclocked':'Empowered'}.</b> ${esc(spellText(name,trad,'higher'))}</p>`:''}
 ${m.perils?`<p class="sp-perils">Psyker power: may trigger Perils of the Warp.</p>`:''}`;
}
document.addEventListener('toggle',e=>{const d=e.target;if(!d.matches||!d.matches('details.sp-d'))return;if(d.open){const b=d.querySelector('.sp-body');if(b&&!b.dataset.done){b.innerHTML=powerBody(d.dataset.sp,d.dataset.trad);b.dataset.done='1';}}},true);

/* o: {list,trad,maxLevel,can,sp,canMax,spMax,spLabel,act,q,lvl,locked:Set} */
function powerPicker(o){
 const lists=CLASS_SPELLS[o.list]||[];const q=N(o.q||'');
 const levels=[];if(o.canMax>0&&(lists[0]||[]).length)levels.push(0);for(let l=1;l<=o.maxLevel;l++)if((lists[l]||[]).length)levels.push(l);
 const lvlSel=o.lvl==null||o.lvl==='all'?'all':+o.lvl;
 const canLeft=o.canMax-o.can.length,spLeft=o.spMax-o.sp.length;
 const tabs=`<div class="pk-tabs">${['all',...levels].map(l=>`<button class="tab${String(lvlSel)===String(l)?' on':''}" data-act="${o.act}-lv" data-v="${l}">${l==='all'?'All':l===0?'Cantrips':'Level '+l}</button>`).join('')}</div>`;
 const counts=`<div class="pk-counts">${o.canMax>0?`<span class="${canLeft?'':'full'}">Cantrips <b>${o.can.length}/${o.canMax}</b></span>`:''}<span class="${spLeft?'':'full'}">${esc(o.spLabel||'Powers')} <b>${o.sp.length}/${o.spMax}</b></span></div>`;
 const rows=[];
 for(const l of levels){if(lvlSel!=='all'&&lvlSel!==l)continue;
  const arr=(lists[l]||[]).filter(n=>{if(!q)return true;const r=spell40k(n,o.trad);return N(n).includes(q)||N(r.name40k).includes(q);});
  if(!arr.length)continue;
  rows.push(`<div class="slvl">${l===0?'Cantrips':'Level '+l}</div>`);
  for(const n of arr){const m=powerMeta(n,o.trad);const kind=l===0?'can':'sp';const sel=(kind==='can'?o.can:o.sp).includes(n);const full=kind==='can'?canLeft<=0:spLeft<=0;const locked=o.locked&&o.locked.has(n);
   rows.push(`<div class="sp${sel?' on':''}"><button class="sp-add" data-act="${o.act}" data-k="${kind}" data-v="${esc(n)}" aria-pressed="${sel}" aria-label="${sel?'Remove':'Add'} ${esc(m.r.name40k)}" ${(!sel&&full)||locked?'disabled':''}>${sel?'✓':'+'}</button>
   <details class="sp-d" data-sp="${esc(n)}" data-trad="${o.trad}"><summary><span class="sp-n">${esc(m.r.name40k)}${m.perils?' <span class="perils">PERILS</span>':''}</span><span class="sp-m">${esc(n)}${m.disc?' · '+esc(m.disc):''}${m.info&&m.info.conc?' · Concentration':''}${m.info&&m.info.ritual?' · Ritual':''}</span><span class="sp-q">${esc(powerSummary(m))}</span></summary><div class="sp-body"></div></details></div>`);}
 }
 return `<div class="picker"><div class="pk-head"><label class="f pk-search"><span>Search</span><input data-pq="${o.act}" value="${esc(o.q||'')}" placeholder="Name in 40k or 5e" data-live></label>${counts}</div>${tabs}
 <p class="note">Tap a power to read what it does. ${o.canMax>0||o.spMax>0?'When a count is full, remove one to choose another.':''}</p>
 <div class="pk-list">${rows.join('')||'<p class="muted">Nothing matches.</p>'}</div></div>`;
}
function pickerToggle(st,kind,name,canMax,spMax){const arr=kind==='can'?st.can:st.sp;const i=arr.indexOf(name);if(i>=0){arr.splice(i,1);return true;}const max=kind==='can'?canMax:spMax;if(arr.length>=max){toastMsg('That count is full. Remove one first.');return false;}arr.push(name);return true;}

/* ===== Character creator (2024 rules, D&D Beyond step order) ===== */
const BG=k=>BG24.find(b=>b.key===k);
const BORIGIN=k=>B_ORIGINS.find(o=>o.key===k);
const SKILL=k=>SKILLS.find(s=>s.key===k);
function newBuild(){const b={step:0,cls:'fighter',sub:'',level:1,bg:'soldier',asiMode:'21',asi2:'str',asi1:'con',origin:'human',homeworld:'void',crewRole:'trader',keen:'perception',humanFeat:'skilled',
 method:'array',assign:{},buy:{str:8,dex:8,con:8,int:8,wis:8,cha:8},rolls:[],skills:[],extra:[],expertise:[],shield:true,can:[],sp:[],miCan:[],miSp:'',name:'',player:'',q:'',lvl:'all',
 picks:{},style:'',opts:{order:'',masteries:[],invocations:[],metamagic:[],maneuvers:[]}};
 autoAssign(b);autoAsi(b);return b;}
function autoAssign(b){const pr=CLASS24[b.cls].primary;const pool=b.method==='roll'&&b.rolls.length?b.rolls:STD_ARRAY;
 const order=pool.map((v,i)=>[v,i]).sort((a,c)=>c[0]-a[0]).map(x=>x[1]);b.assign={};pr.forEach((a,i)=>b.assign[a]=order[i]);}
function autoAsi(b){const bg=BG(b.bg);const pr=CLASS24[b.cls].primary;const rank=[...bg.abil].sort((a,c)=>pr.indexOf(a)-pr.indexOf(c));b.asi2=rank[0];b.asi1=rank[1];}
function bBase(b){const o={};if(b.method==='buy'){ABIL.forEach(a=>o[a]=b.buy[a]);return o;}
 const pool=b.method==='roll'&&b.rolls.length?b.rolls:STD_ARRAY;ABIL.forEach(a=>o[a]=b.assign[a]!=null?pool[b.assign[a]]:8);return o;}
function bBgBonus(b){const o={str:0,dex:0,con:0,int:0,wis:0,cha:0};const bg=BG(b.bg);
 if(b.asiMode==='111')bg.abil.forEach(a=>o[a]+=1);else{if(b.asi2)o[b.asi2]+=2;if(b.asi1&&b.asi1!==b.asi2)o[b.asi1]+=1;}return o;}
function bFeatLevels(b){return featLevels(b.cls,b.level);}
function bScores(b){const base=bBase(b),bon=bBgBonus(b);const o={};ABIL.forEach(a=>o[a]=Math.min(20,base[a]+bon[a]));
 for(const L of bFeatLevels(b)){const fb=featBonus(b.picks[L]);for(const [a,v] of Object.entries(fb))o[a]=Math.min(20,o[a]+v);}return o;}
function bFeatKeys(b){return bFeatLevels(b).map(L=>b.picks[L]).filter(p=>p&&p.type==='feat').map(p=>p.key);}
function bOriginFeats(b){const f=[BG(b.bg).feat];if(b.origin==='human'&&b.humanFeat)f.push(b.humanFeat);return f;}
function bSkillState(b){
 const bg=BG(b.bg);const c=CLASS24[b.cls];const of=bOriginFeats(b);const gf=bFeatKeys(b);
 const fixed=[...bg.skills];const classN=c.skills[0];const classList=c.skills[1];
 let extraN=0,extraLabel=[];
 if(b.origin==='human'){extraN+=1;extraLabel.push('Skillful (Human)');}
 const skilled=of.filter(f=>f==='skilled').length;if(skilled){extraN+=3*skilled;extraLabel.push('Polymath feat');}
 const se=gf.filter(f=>f==='skillexpert').length;if(se){extraN+=se;extraLabel.push('Specialist feat');}
 const keen=(b.origin==='aeldari'||b.origin==='drukhari')?b.keen:null;
 const expN=expertiseCount(b.cls,b.level)+se;
 const prof=new Set([...fixed,...b.skills,...b.extra,...(keen?[keen]:[])]);
 return {fixed,classN,classList,extraN,extraLabel:extraLabel.join(' + '),keen,expN,prof};
}
function bList(b){return spellListFor(b.cls,b.level>=3?b.sub:'');}
function bLimits(b){return spellLimits(b.cls,b.level,b.level>=3?b.sub:'',b.opts);}
function bSubNow(b){return b.level>=3?b.sub:'';}
function bOptGroups(b){return classOptionGroups(b.cls,b.level,bSubNow(b),b.opts,b.can);}
function bMI(b){const bg=BG(b.bg);return bg.feat==='magicinitiate'?bg.featList:(b.origin==='human'&&b.humanFeat==='magicinitiate'?'wizard':null);}
function bAC(b,sc){const k=CLASS24[b.cls].kit;const dx=modOf(sc.dex);let ac;
 if(k.armor){const [base,cap]=ARMOR_AC[k.armor];ac=base+Math.min(dx,cap);if(b.style==='defense')ac+=1;}else if(k.unarmored)ac=10+dx+modOf(sc[k.unarmored]);else ac=10+dx;
 if(k.shield&&b.shield)ac+=2;return ac;}
function bSteps(b){const s=['Career','Background','Origin','Characteristics','Skills'];if(bOptGroups(b).length)s.push('Class options');
 if(bFeatLevels(b).length||b.level>=styleLevel(b.cls))s.push('Feats');s.push('Wargear');
 if((bList(b)&&maxPowerLevel(b.cls,b.level,b.level>=3?b.sub:'')>=0&&(bLimits(b).cantrips||bLimits(b).spells))||bMI(b))s.push('Powers');s.push('Finish');return s;}
function bToSrc(b){
 const sc=bScores(b);const pb=profFor(b.level);const c=CLASS24[b.cls];const d=CLASSES[b.cls];const bg=BG(b.bg);const o=BORIGIN(b.origin);const ss=bSkillState(b);
 const con=modOf(sc.con);const of=bOriginFeats(b);const gf=bFeatKeys(b);
 let hp=d.hd+con+(b.level-1)*(d.hd/2+1+con);if(of.includes('tough')||gf.includes('tough'))hp+=2*b.level;if(b.origin==='squat')hp+=b.level;
 const skills={};ss.prof.forEach(k=>skills[k]=1);b.expertise.forEach(k=>{if(ss.prof.has(k))skills[k]=2;});
 const saves={};c.saves.forEach(a=>saves[a]=true);
 for(const L of bFeatLevels(b)){const p=b.picks[L];if(p&&p.type==='feat'&&FEATS[p.key]&&FEATS[p.key].save&&p.abil)saves[p.abil]=true;}
 const weapons=c.kit.weapons.map(n=>{const [dice,type,ab]=KIT5E[n];const m=ab==='fin'?Math.max(modOf(sc.str),modOf(sc.dex)):modOf(sc[ab]);const arch=b.style==='archery'&&ab==='dex'?2:0;return {name:n,atk:sgn(m+pb+arch),dmg:`${dice}${m?sgn(m):''} ${type[0].toUpperCase()+type.slice(1)}`};});
 const feats=[];of.forEach(f=>{const F=ORIGIN_FEATS[f];feats.push({level:1,key:f,name:F[0],w40:F[1],text:F[2],origin:true});});
 for(const L of bFeatLevels(b)){const r=featRecord(b.picks[L],L);if(r)feats.push(r);}
 const spells=[...b.can,...b.sp,...b.miCan,...(b.miSp?[b.miSp]:[])];
 return {v:2,name:b.name.trim()||'Unnamed',player:b.player.trim(),race:o.species,background:bg.name,alignment:'',
  classes:[{cls:b.cls,level:b.level,sub:b.level>=3?b.sub:''}],abilities:sc,maxHp:hp,ac:bAC(b,sc),speed:o.speed,skills,saves,weapons,
  armor:c.kit.armor,shield:c.kit.shield&&b.shield,spells:[...new Set(spells)],feats,style:b.style||'',built:true,opts:trimOpts(b.cls,b.level,bSubNow(b),b.opts,b.can),
  features:`${o.species} traits: ${SPECIES24_NOTE[o.key]}`,
  equipment:[c.kit.armor,c.kit.shield&&b.shield?'Shield':'',...c.kit.weapons,c.kit.gear,'Void suit, vox-bead'].filter(Boolean).join(', '),languages:'Low Gothic, one other',warnings:[]};
}

function bCard(sel,act,val,title,sub,body,extra){return `<button class="pick${sel?' on':''}" data-act="${act}" data-v="${esc(val)}" aria-pressed="${sel}"><span class="pick-t">${title}</span>${sub?`<span class="pick-s">${sub}</span>`:''}${body?`<span class="pick-b">${body}</span>`:''}${extra||''}</button>`;}
function levelStepper(val,act,label){return `<div class="lvl-step"><span class="k">${label}</span><div class="row"><button class="step big" data-act="${act}" data-d="-1" aria-label="Lower level" ${val<=1?'disabled':''}>−</button><span class="lvl-n mono">${val}</span><button class="step big" data-act="${act}" data-d="1" aria-label="Raise level" ${val>=20?'disabled':''}>+</button></div></div>`;}
function featPickUI(L,pick,ctx,cur){
 pick=pick||{type:'asi'};
 const abilOpts=(sel,list)=>list.map(a=>opt(a,ABIL_FULL[a]+(cur?` (${cur[a]})`:''),sel)).join('');
 const F=pick.type==='feat'&&FEATS[pick.key];
 return `<div class="featpick"><div class="fp-h"><span class="mono lvl-tag">Level ${L}</span><div class="row"><label class="chip"><input type="radio" name="fp${ctx}${L}" data-fp="${L}" data-fk="type" value="asi"${pick.type==='asi'?' checked':''}> Raise characteristics</label><label class="chip"><input type="radio" name="fp${ctx}${L}" data-fp="${L}" data-fk="type" value="feat"${pick.type==='feat'?' checked':''}> Take a feat</label></div></div>
 ${pick.type==='asi'?`<div class="fields"><label class="f">+1<select data-fp="${L}" data-fk="a1">${opt('','Choose…',pick.a1)}${abilOpts(pick.a1,ANY)}</select></label><label class="f">+1 (same again for +2)<select data-fp="${L}" data-fk="a2">${opt('','Choose…',pick.a2)}${abilOpts(pick.a2,ANY)}</select></label></div>`
 :`<div class="fields"><label class="f">Feat<select data-fp="${L}" data-fk="key">${opt('','Choose a feat…',pick.key)}${Object.entries(FEATS).filter(([k])=>k!=='asi').sort((a,c)=>a[1].w40.localeCompare(c[1].w40)).map(([k,f])=>opt(k,`${f.w40} (${f.name})`,pick.key)).join('')}</select></label>
  ${F&&F.abil.length?`<label class="f">+1 to<select data-fp="${L}" data-fk="abil">${opt('','Choose…',pick.abil)}${abilOpts(pick.abil,F.abil)}</select></label>`:''}</div>${F?`<p class="note"><b>${esc(F.w40)}.</b> ${esc(F.text)}</p>`:''}`}</div>`;
}
function vBuild(){
 const b=S.build;const steps=bSteps(b);if(b.step>=steps.length)b.step=steps.length-1;const step=steps[b.step];
 const nav=`<ol class="stepper">${steps.map((s,i)=>`<li><button data-act="bstep" data-i="${i}" ${i===b.step?'aria-current="step"':''}><span class="mono">${String(i+1).padStart(2,'0')}</span> ${s}</button></li>`).join('')}</ol>`;
 let body='';const sc=bScores(b);
 if(step==='Career'){
  const d=CLASSES[b.cls];
  body=`<div class="career-top">${levelStepper(b.level,'blevel','Starting level')}
   <label class="f" style="flex:1 1 240px">Subclass${b.level<3?' (chosen at level 3)':''}<select data-b="sub" ${b.level<3?'disabled':''}>${opt('',b.level<3?'Unlocks at level 3':'Choose a subclass…',b.sub)}${d.subs.map(s=>opt(s[0],`${s[1]} (${s[0]})`,b.sub)).join('')}</select>${b.sub&&b.level>=3?`<span class="subdesc">${esc(subDesc(b.sub))}</span>`:''}</label></div>
  <p class="note" style="margin:6px 0 16px">${b.level===1?'Most campaigns start at level 1. Ask your GM if you\'re starting higher.':`Starting at level ${b.level}: you'll choose ${bFeatLevels(b).length?`${bFeatLevels(b).length} feat or characteristic increase${bFeatLevels(b).length>1?'s':''} and `:''}any extra powers in the later steps.`}</p>
  <h3 class="sub-h" style="margin-top:0">Choose a career</h3>
  <div class="picks">${Object.entries(CLASSES).map(([k,c])=>{const t=c.trad?TRAD[c.trad].name:'No powers';return bCard(k===b.cls,'bcls',k,esc(c.career),`${esc(c.name)} · d${c.hd}`,`${t}${c.trad==='psyker'?' · <span class="perils">PERILS</span>':''}${k==='artificer'?' · <em>not in the 2024 PHB</em>':''}`);}).join('')}</div>`;
 }
 else if(step==='Background'){
  const bg=BG(b.bg);
  body=`<div class="picks">${BG24.map(x=>bCard(x.key===b.bg,'bbg',x.key,esc(x.w40),esc(x.name),`${x.skills.map(k=>esc(SKILL(k).w40)).join(', ')} · ${esc(ORIGIN_FEATS[x.feat][1])}<br><span class="mono" style="font-size:12px">${x.abil.map(a=>a.toUpperCase()).join(' / ')}</span>`)).join('')}</div>
  <h3 class="sub-h">Characteristic bonuses from ${esc(bg.w40)}</h3>
  <div class="row"><label class="chip"><input type="radio" name="asim" data-b="asiMode" value="21"${b.asiMode==='21'?' checked':''}> +2 and +1</label><label class="chip"><input type="radio" name="asim" data-b="asiMode" value="111"${b.asiMode==='111'?' checked':''}> +1 to all three</label></div>
  ${b.asiMode==='21'?`<div class="fields" style="margin-top:10px"><label class="f">+2 to<select data-b="asi2">${bg.abil.map(a=>opt(a,ABIL_FULL[a],b.asi2)).join('')}</select></label><label class="f">+1 to<select data-b="asi1">${bg.abil.filter(a=>a!==b.asi2).map(a=>opt(a,ABIL_FULL[a],b.asi1)).join('')}</select></label></div>`:''}
  <h3 class="sub-h">Origin feat</h3><div class="trait"><b>${esc(ORIGIN_FEATS[bg.feat][1])}</b> <span class="muted">(${esc(ORIGIN_FEATS[bg.feat][0])}${bg.featList?', '+esc(CLASSES[bg.featList].name)+' list':''})</span>: ${esc(ORIGIN_FEATS[bg.feat][2])}</div>
  <div class="fields" style="margin-top:14px"><label class="f">Crew role<select data-b="crewRole">${Object.entries(CREW_ROLES).map(([k,v])=>opt(k,v[0],b.crewRole)).join('')}</select></label></div>
  <p class="note">${esc(CREW_ROLES[b.crewRole][1])} Downtime: ${esc(CREW_ROLES[b.crewRole][2])}</p>`;
 }
 else if(step==='Origin'){
  const o=BORIGIN(b.origin);const ot=ORIGINS[b.origin];
  body=`<div class="picks">${B_ORIGINS.map(x=>bCard(x.key===b.origin,'borg',x.key,esc(x.name),esc(x.species)+(x.speed!==30?` · ${x.speed} ft`:''),'',ORIGINS[x.key].xenos?'<span class="chip xenos" style="margin-top:6px">Xenos</span>':'')).join('')}</div>
  <h3 class="sub-h">${esc(o.name)}</h3>
  <div class="trait"><b>2024 ${esc(o.species)} traits.</b> ${esc(SPECIES24_NOTE[o.key])}</div>
  ${ot.traits.map(t=>`<div class="trait"><b>${esc(t[0])}.</b> ${esc(t[1])}</div>`).join('')}
  <div class="fields" style="margin-top:12px">
  ${b.origin==='human'?`<label class="f">Homeworld<select data-b="homeworld">${Object.entries(HOMEWORLDS).map(([k,v])=>opt(k,v[0],b.homeworld)).join('')}</select></label>
   <label class="f">Versatile: extra origin feat<select data-b="humanFeat">${Object.entries(ORIGIN_FEATS).map(([k,v])=>opt(k,`${v[1]} (${v[0]})`,b.humanFeat)).join('')}</select></label>`:''}
  ${b.origin==='aeldari'||b.origin==='drukhari'?`<label class="f">Keen Senses<select data-b="keen">${['insight','perception','survival'].map(k=>opt(k,SKILL(k).w40,b.keen)).join('')}</select></label>`:''}
  </div>${b.origin==='human'?`<p class="note">${esc(HOMEWORLDS[b.homeworld][1])} <b>${esc(ORIGIN_FEATS[b.humanFeat][1])}:</b> ${esc(ORIGIN_FEATS[b.humanFeat][2])}</p>`:''}`;
 }
 else if(step==='Characteristics'){
  const base=bBase(b),bon=bBgBonus(b);
  const pool=b.method==='roll'&&b.rolls.length?b.rolls:STD_ARRAY;
  const used={};Object.values(b.assign).forEach(i=>used[i]=(used[i]||0)+1);
  const spent=ABIL.reduce((s,a)=>s+POINT_COST[b.buy[a]],0);
  body=`<div class="row" role="tablist">${[['array','Standard array'],['buy','Point buy'],['roll','Roll 4d6']].map(([k,l])=>`<button class="btn sm${b.method===k?' primary':''}" data-act="bmethod" data-v="${k}" aria-pressed="${b.method===k}">${l}</button>`).join('')}
   ${b.method==='roll'?`<button class="btn sm" data-act="broll">${b.rolls.length?'Reroll':'Roll the dice'}</button>`:''}${b.method==='buy'?`<span class="mono" style="color:${spent>27?'var(--blood)':'var(--gold-hi)'}">${27-spent} of 27 points left</span>`:''}</div>
  ${b.method==='roll'&&b.rolls.length?`<p class="note mono">Rolled: ${b.rolls.join(', ')}</p>`:''}
  <div class="tscroll" style="margin-top:12px"><table class="wtable"><thead><tr><th>Characteristic</th><th>Base</th><th>Background</th><th>Score</th><th>Mod</th></tr></thead><tbody>

/* Supabase party store, shaped like the claude db API the rest of the app uses */
function supaDB(client,code){
 const listeners=[];let last=0;
 const chan=client.channel('party-'+code.replace('-',''),{config:{broadcast:{self:false}}});
 async function refresh(){const {data,error}=await client.rpc('party_list',{p_party:code});
  if(error){listeners.forEach(l=>l.err&&l.err({code:'unavailable',message:error.message}));return;}
  const snap={docs:(data||[]).map(r=>({id:r.id,data:()=>r.data}))};last=Date.now();listeners.forEach(l=>l.next(snap));}
 const ping=()=>{try{chan.send({type:'broadcast',event:'changed',payload:{t:Date.now()}});}catch(e){}};
 chan.on('broadcast',{event:'changed'},()=>refresh()).subscribe();
 setInterval(()=>{if(document.visibilityState==='visible'&&Date.now()-last>25000)refresh();},5000);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh();});
 return {code,collection:()=>({
  onSnapshot(next,err){listeners.push({next,err});refresh();return ()=>{};},
  doc:id=>({
   set:async body=>{const {error}=await client.rpc('party_save',{p_party:code,p_id:id,p_data:body});if(error)throw error;last=Date.now();ping();},
   delete:async()=>{const {error}=await client.rpc('party_delete',{p_party:code,p_id:id});if(error)throw error;ping();refresh();}
  })})};
}

/* ---------- dice ---------- */
function rollExpr(expr){
 const s=String(expr||'').replace(/−/g,'-');const parts=[];let total=0;let m;const rx=/(\d*)d(\d+)/gi;let rest=s;
 while((m=rx.exec(s))){const n=+(m[1]||1),f=+m[2];const r=[];for(let i=0;i<n;i++)r.push(1+Math.floor(Math.random()*f));parts.push(`${n}d${f}[${r.join(',')}]`);total+=r.reduce((a,b)=>a+b,0);}
 rest=s.replace(rx,' ');const flats=rest.match(/[+-]\s*\d+/g)||[];flats.forEach(x=>total+=parseInt(x.replace(/\s/g,''),10));
 return {total,detail:parts.join(' ')+(flats.length?' '+flats.join(' ').replace(/\s+/g,''):'')};
}
function d20(label,mod){const r=1+Math.floor(Math.random()*20);pushRoll({label,total:r+mod,detail:`d20[${r}] ${sgn(mod)}`,crit:r===20,fail:r===1});return r;}
function pushRoll(r){S.rolls.unshift(r);S.rolls=S.rolls.slice(0,4);drawDice();clearTimeout(pushRoll.t);pushRoll.t=setTimeout(()=>{S.rolls=[];drawDice();},9000);}
function toastMsg(t){pushRoll({label:t,total:'',detail:''});}
function drawDice(){$('#dice').innerHTML=S.rolls.map(r=>`<div class="die${r.crit?' crit':''}${r.fail?' fail':''}">${esc(r.label)}${r.total!==''?`<b>${esc(r.total)}</b>`:''}${r.detail?`<div class="mono" style="font-size:11px;opacity:.75">${esc(r.detail)}</div>`:''}</div>`).join('');}
