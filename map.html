<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battle Map · Rogue Trader Manifest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Cinzel:wght@500;700&family=Share+Tech+Mono&display=swap">
<style>
:root{
 --bg:#0D0C0A;--plate:#1B1815;--plate-hi:#25201B;--sunk:#0A0908;--ink:#E8DEC6;--muted:#A0957D;--line:#3B3229;
 --gold:#C8A24A;--gold-hi:#EBCB7A;--gold-dk:#7A5C1E;--blood:#B3262A;--blood-dk:#5E0F12;--warp:#8E5BC4;--ok:#7FA36A;--warn:#D08A2E;
 --f-display:'Cinzel',Georgia,serif;--f-body:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
 color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));background:linear-gradient(180deg,#221d18,var(--plate));border-bottom:1px solid var(--gold-dk);min-width:0}
h1{font:700 15px var(--f-display);letter-spacing:.08em;color:var(--gold-hi);margin:0;white-space:nowrap}
header .sp{flex:1}
.code{font:13px var(--f-mono);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block;flex:none}
.dot.live{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dot.off{background:var(--blood)}
a{color:var(--gold-hi)}
select,input,button{font:inherit;color:var(--ink)}
select,input{background:var(--sunk);border:1px solid var(--line);border-radius:2px;padding:6px 8px;min-width:0}
input:focus,select:focus{outline:1px solid var(--gold);border-color:var(--gold)}
button{background:var(--plate-hi);border:1px solid var(--line);border-radius:2px;padding:7px 10px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--gold-dk)}
button.pri{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#140F06;border-color:var(--gold-dk);font-weight:700}
button.bad{border-color:var(--blood-dk);color:#f0b8b8}
button.on{border-color:var(--gold);background:#3a2f1c;color:var(--gold-hi)}
button:disabled{opacity:.45;cursor:default}
#role{max-width:44vw}
main{position:relative;display:grid;grid-template-columns:1fr 340px;min-height:0}
#stage{position:relative;min-height:0;overflow:hidden;touch-action:none;background:#08070a}
#cv{display:block;width:100%;height:100%;cursor:grab}
#cv.paint{cursor:crosshair}
.hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hud button{width:36px;height:36px;padding:0;background:rgba(27,24,21,.92);font-size:18px;line-height:1}
.chip{font:12px var(--f-mono);color:var(--muted);background:rgba(13,12,10,.85);border:1px solid var(--line);padding:4px 8px;border-radius:2px}
#banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#140F06;font:700 14px var(--f-display);letter-spacing:.06em;padding:8px 16px;border:1px solid var(--gold-dk);box-shadow:0 4px 18px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#2b1214;border:1px solid var(--blood);padding:8px 14px;max-width:90%;font-size:14px;pointer-events:none}
aside{border-left:1px solid var(--gold-dk);background:var(--plate);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:10px 6px;font:700 12px var(--f-display);letter-spacing:.08em;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--gold-hi);border-bottom-color:var(--gold)}
.tabs .grip{flex:0 0 44px;display:none}
.body{overflow:auto;padding:12px;padding-bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
h3{font:700 12px var(--f-display);letter-spacing:.1em;color:var(--gold);margin:4px 0 0;text-transform:uppercase}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>input,.row>select{flex:1}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
label:not(.ck)>input,label>select{width:100%}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.muted{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:4px}
.it{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--sunk);border:1px solid var(--line);border-radius:2px;cursor:pointer}
.it.cur{border-color:var(--gold);background:#2a2216}
.it.sel{outline:1px dashed var(--ink)}
.it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it input{width:56px;text-align:center}
.sw{width:18px;height:18px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.35)}
.hp{font:12px var(--f-mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{padding:4px 8px;font-size:13px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.lg{width:14px;height:14px;border:1px solid var(--line);flex:none}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid transparent}
.colors button.on{border-color:var(--ink)}
#join{position:fixed;inset:0;background:rgba(8,7,10,.92);display:grid;place-items:center;padding:20px;z-index:5}
#join .box{background:var(--plate);border:1px solid var(--gold-dk);padding:20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
#join h2{font:700 18px var(--f-display);color:var(--gold-hi);margin:0}
@media (max-width:760px){
 main{grid-template-columns:1fr;grid-template-rows:1fr auto}
 aside{border-left:0;border-top:1px solid var(--gold-dk);max-height:48dvh}
 aside.min{max-height:none}
 aside.min .body{display:none}
 .tabs .grip{display:block}
 h1 .long{display:none}
 #banner{top:56px}
 .code{display:none}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1>⚔ <span class="long">Battle </span>Map</h1>
  <span class="dot" id="dot" title="Connecting"></span>
  <span class="code" id="codeLbl"></span>
  <span class="sp"></span>
  <select id="role" aria-label="Who are you?"></select>
  <a href="gm.html" id="gmLink" title="GM screen" hidden>GM screen</a>
  <a href="./" title="Character sheets">Sheets</a>
 </header>
 <main>
  <div id="stage">
   <canvas id="cv"></canvas>
   <div class="hud">
    <button id="zIn" title="Zoom in">+</button><button id="zOut" title="Zoom out">−</button><button id="zFit" title="Fit map">⤢</button><button id="zMe" title="Find my token">◎</button>
    <span class="chip">1 square = 5 ft</span>
   </div>
   <div id="banner" hidden></div>
   <div id="toast" hidden></div>
  </div>
  <aside id="side">
   <div class="tabs" id="tabs"></div>
   <div class="body" id="panel"></div>
  </aside>
 </main>
</div>
<div id="join" hidden><div class="box">
 <h2>Join the battle map</h2>
 <p class="muted" style="margin:0">Enter your party code. It's the same code your character sheets use (it looks like VOID-7K3Q).</p>
 <input id="joinCode" placeholder="VOID-7K3Q" autocomplete="off" autocapitalize="characters">
 <button class="pri" id="joinBtn">Join</button>
 <p class="muted" style="margin:0">No party yet? Create one from the <a href="./">character sheets</a> first.</p>
</div></div>

<script>
/*GEN-START*/
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=hashStr(String(seed));return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// Terrain: ' ' void, '.' floor, '#' wall, '+' door, 'c' cover (half cover, difficult), 'd' difficult, 'h' hazard
const WALK='.+cdh';
const COST={'.':1,'+':1,'h':1,'c':2,'d':2};
const THEMES={ship:'Voidship deck',hive:'Hive underworks',maze:'Egarian labyrinth',open:'Open ground'};
const SIZES={s:[20,15,'Small · 100×75 ft'],m:[30,20,'Medium · 150×100 ft'],l:[40,28,'Large · 200×140 ft']};

function generate(theme,w,h,seed){
 const R=rng(seed+':'+theme+':'+w+'x'+h);const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
 let g=new Array(w*h).fill('#');
 const at=(x,y)=>(x<0||y<0||x>=w||y>=h)?'#':g[y*w+x];
 const set=(x,y,c)=>{if(x>0&&y>0&&x<w-1&&y<h-1)g[y*w+x]=c;};
 const rect=(x0,y0,x1,y1,c)=>{for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)set(x,y,c);};
 const blob=(c,steps,only)=>{let x=ri(2,w-3),y=ri(2,h-3);for(let i=0;i<steps;i++){if(!only||only.includes(at(x,y)))set(x,y,c);x+=ri(-1,1);y+=ri(-1,1);x=Math.max(1,Math.min(w-2,x));y=Math.max(1,Math.min(h-2,y));}};
 let start={x:2,y:h>>1};
 if(theme==='ship'){
  const leaves=[];
  (function split(x,y,W,H,d){
   const canH=W>=14,canV=H>=12;
   if(d>4||(!canH&&!canV)||(d>2&&R()<.25)){leaves.push({x,y,W,H});return;}
   const horiz=canH&&(!canV||W/H>1.2||(W/H>.8&&R()<.5));
   if(horiz){const s=ri(6,W-6);split(x,y,s,H,d+1);split(x+s,y,W-s,H,d+1);}
   else{const s=ri(5,H-5);split(x,y,W,s,d+1);split(x,y+s,W,H-s,d+1);}
  })(1,1,w-2,h-2,0);
  const rooms=leaves.map(l=>{const rw=ri(Math.max(3,Math.floor(l.W*.55)),l.W-2),rh=ri(Math.max(3,Math.floor(l.H*.55)),l.H-2);
   const rx=l.x+ri(1,Math.max(1,l.W-rw-1)),ry=l.y+ri(1,Math.max(1,l.H-rh-1));return{x:rx,y:ry,w:rw,h:rh,cx:rx+(rw>>1),cy:ry+(rh>>1)};});
  rooms.forEach(r=>rect(r.x,r.y,r.x+r.w-1,r.y+r.h-1,'.'));
  const corr=(a,b)=>{if(R()<.5){rect(a.cx,a.cy,b.cx,a.cy+1,'.');rect(b.cx,a.cy,b.cx+1,b.cy,'.');}else{rect(a.cx,a.cy,a.cx+1,b.cy,'.');rect(a.cx,b.cy,b.cx,b.cy+1,'.');}};
  for(let i=1;i<rooms.length;i++)corr(rooms[i-1],rooms[i]);
  for(let k=0;k<Math.floor(rooms.length/3);k++)corr(rooms[ri(0,rooms.length-1)],rooms[ri(0,rooms.length-1)]);
  const inRoom=(x,y)=>rooms.some(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h);
  rooms.forEach(r=>{
   const sides=[[],[],[],[]];
   for(let x=r.x;x<r.x+r.w;x++){sides[0].push([x,r.y-1]);sides[1].push([x,r.y+r.h]);}
   for(let y=r.y;y<r.y+r.h;y++){sides[2].push([r.x-1,y]);sides[3].push([r.x+r.w,y]);}
   sides.forEach(side=>{let run=[];const flush=()=>{if(run.length&&run.length<=3)run.forEach(([x,y])=>set(x,y,'+'));run=[];};
    side.forEach(([x,y])=>{if(at(x,y)==='.'&&!inRoom(x,y))run.push([x,y]);else flush();});flush();});
  });
  rooms.forEach(r=>{if(r.w*r.h<16)return;for(let i=ri(0,2);i>0;i--){const x=ri(r.x+1,r.x+r.w-2),y=ri(r.y+1,r.y+r.h-2);if(at(x,y)==='.')set(x,y,'c');}});
  if(rooms.length>2&&R()<.6){const r=rooms[ri(1,rooms.length-1)];const x=ri(r.x,r.x+r.w-2),y=ri(r.y,r.y+r.h-2);for(const[dx,dy]of[[0,0],[1,0],[0,1],[1,1]])if(at(x+dx,y+dy)==='.')set(x+dx,y+dy,'h');}
  start={x:rooms[0].cx,y:rooms[0].cy};
 }else if(theme==='hive'){
  let best=null;
  for(let tries=0;tries<6;tries++){
   let a=new Array(w*h);for(let i=0;i<w*h;i++){const x=i%w,y=(i/w)|0;a[i]=(x===0||y===0||x===w-1||y===h-1||R()<.45)?'#':'.';}
   for(let it=0;it<5;it++){const b=a.slice();for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(a[(y+dy)*w+x+dx]==='#')n++;b[y*w+x]=n>=5?'#':'.';}a=b;}
   const reg=regions(a,w,h);if(reg.length&&(!best||reg[0].length>best.size))best={a,size:reg[0].length,cells:reg[0]};
   if(best&&best.size>w*h*.38)break;
  }
  if(!best){rect(2,2,w-3,h-3,'.');best={cells:[]};for(let i=0;i<w*h;i++)if(g[i]==='.')best.cells.push(i);}
  else{g=best.a.map(c=>c==='.'?'#':c);best.cells.forEach(i=>g[i]='.');}
  for(let i=Math.max(2,(w*h/140)|0);i>0;i--)blob('d',ri(5,12),'.');
  for(let i=Math.max(1,(w*h/400)|0);i>0;i--)blob('h',ri(4,8),'.');
  const pick=best.cells.reduce((p,i)=>(i%w)<(p%w)?i:p,best.cells[0]);start={x:pick%w,y:(pick/w)|0};
 }else if(theme==='maze'){
  const cols=Math.floor((w-1)/3),rows=Math.floor((h-1)/3);const seen=new Uint8Array(cols*rows);
  const cell=(i,j)=>rect(1+3*i,1+3*j,2+3*i,2+3*j,'.');
  const link=(i,j,k,l)=>{if(k>i)rect(3+3*i,1+3*j,3+3*i,2+3*j,'.');else if(k<i)rect(3*i,1+3*j,3*i,2+3*j,'.');else if(l>j)rect(1+3*i,3+3*j,2+3*i,3+3*j,'.');else rect(1+3*i,3*j,2+3*i,3*j,'.');};
  const st=[[0,rows>>1]];seen[(rows>>1)*cols]=1;cell(0,rows>>1);
  while(st.length){const[i,j]=st[st.length-1];const nb=[[i+1,j],[i-1,j],[i,j+1],[i,j-1]].filter(([k,l])=>k>=0&&l>=0&&k<cols&&l<rows&&!seen[l*cols+k]);
   if(!nb.length){st.pop();continue;}const[k,l]=nb[ri(0,nb.length-1)];seen[l*cols+k]=1;cell(k,l);link(i,j,k,l);st.push([k,l]);}
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){if(i<cols-1&&R()<.12)link(i,j,i+1,j);if(j<rows-1&&R()<.12)link(i,j,i,j+1);}
  for(let c=0;c<2&&cols>3&&rows>3;c++){const i=ri(1,cols-3),j=ri(0,rows-2);rect(1+3*i,1+3*j,2+3*(i+1),2+3*(j+1),'.');}
  for(let i=Math.max(2,(w*h/110)|0);i>0;i--){const x=ri(1,w-2),y=ri(1,h-2);if(at(x,y)==='.')set(x,y,'h');}
  start={x:1,y:1+3*(rows>>1)};
 }else{
  rect(1,1,w-2,h-2,'.');
  for(let i=(w*h/55)|0;i>0;i--){let x=ri(4,w-5),y=ri(2,h-3);const len=ri(2,5),dir=ri(0,3);const bend=R()<.4;
   for(let k=0;k<len;k++){set(x,y,'#');if(dir===0)x++;else if(dir===1)x--;else if(dir===2)y++;else y--;}
   if(bend)for(let k=0;k<ri(1,3);k++){set(x,y,'#');if(dir<2)y++;else x++;}}
  for(let i=(w*h/45)|0;i>0;i--){const x=ri(3,w-4),y=ri(1,h-2);for(let k=ri(1,3);k>0;k--){const xx=x+ri(-1,1),yy=y+ri(-1,1);if(at(xx,yy)==='.')set(xx,yy,'c');}}
  for(let i=Math.max(2,(w*h/120)|0);i>0;i--)blob('d',ri(4,10),'.');
  if(R()<.6)blob('h',ri(5,9),'.');
  start={x:2,y:h>>1};
 }
 const m={w,h,theme,seed:String(seed),cells:g.join('')};
 m.start=nearestWalk(m,start.x,start.y)||{x:1,y:1};
 // drop pockets you can't walk to, then turn walls far from any floor into empty void
 const d=flood(m,m.start.x,m.start.y);
 for(let i=0;i<w*h;i++)if(WALK.includes(g[i])&&d[i]<0)g[i]='#';
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(g[y*w+x]!=='#')continue;let near=false;
  for(let dy=-1;dy<=1&&!near;dy++)for(let dx=-1;dx<=1;dx++){const c=at(x+dx,y+dy);if(c!=='#'&&c!==' '&&WALK.includes(c)){near=true;break;}}
  if(!near)g[y*w+x]=' ';}
 m.cells=g.join('');
 let far=0;for(let i=0;i<w*h;i++)if(d[i]>d[far]&&WALK.includes(g[i]))far=i;
 m.foe={x:far%w,y:(far/w)|0};
 return m;
}
function regions(a,w,h){const seen=new Uint8Array(w*h),out=[];
 for(let i=0;i<w*h;i++){if(seen[i]||a[i]!=='.')continue;const q=[i],reg=[];seen[i]=1;
  while(q.length){const c=q.pop();reg.push(c);const x=c%w,y=(c/w)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const n=(y+dy)*w+x+dx;if(x+dx<0||x+dx>=w||y+dy<0||y+dy>=h||seen[n]||a[n]!=='.')continue;seen[n]=1;q.push(n);}}
  out.push(reg);}
 return out.sort((p,q)=>q.length-p.length);}
function cellAtM(m,x,y){return(x<0||y<0||x>=m.w||y>=m.h)?' ':m.cells[y*m.w+x];}
function walkable(m,x,y,s){s=s||1;for(let j=0;j<s;j++)for(let i=0;i<s;i++)if(!WALK.includes(cellAtM(m,x+i,y+j)))return false;return true;}
function stepCost(m,x,y,s){let c=1;for(let j=0;j<(s||1);j++)for(let i=0;i<(s||1);i++)c=Math.max(c,COST[cellAtM(m,x+i,y+j)]||1);return c;}
function nearestWalk(m,x,y,s,taken){let best=null,bd=1e9;for(let yy=0;yy<m.h;yy++)for(let xx=0;xx<m.w;xx++){if(!walkable(m,xx,yy,s)||(taken&&taken(xx,yy,s)))continue;const dd=Math.max(Math.abs(xx-x),Math.abs(yy-y))*100+Math.abs(xx-x)+Math.abs(yy-y);if(dd<bd){bd=dd;best={x:xx,y:yy};}}return best;}
// Movement cost in squares (2024 rules: every square, diagonal or not, is 5 ft; difficult terrain costs double).
// No cutting diagonally past a wall corner.
function flood(m,sx,sy,s){s=s||1;const N=m.w*m.h,d=new Int32Array(N).fill(-1);if(!walkable(m,sx,sy,s))return d;
 const buckets=[[sy*m.w+sx]];d[sy*m.w+sx]=0;
 for(let cost=0;cost<buckets.length;cost++){const b=buckets[cost];if(!b)continue;
  for(let k=0;k<b.length;k++){const c=b[k];if(d[c]!==cost)continue;const x=c%m.w,y=(c/m.w)|0;
   for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(!walkable(m,nx,ny,s))continue;
    if(dx&&dy&&(!walkable(m,x+dx,y,s)||!walkable(m,x,y+dy,s)))continue;
    const nc=cost+stepCost(m,nx,ny,s),n=ny*m.w+nx;if(d[n]>=0&&d[n]<=nc)continue;d[n]=nc;(buckets[nc]=buckets[nc]||[]).push(n);}}}

  if(t.cond&&t.cond.length){ctx.fillStyle='#8E5BC4';ctx.beginPath();ctx.arc(x0+sz-cs*.16,y0+cs*.16,cs*.12,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font=`700 ${cs*.16}px sans-serif`;ctx.fillText(t.cond.length,x0+sz-cs*.16,y0+cs*.17);}
  ctx.globalAlpha=1;
  if(t.id===S.sel){ctx.strokeStyle='#fff';ctx.lineWidth=1.5*dpr;ctx.setLineDash([5*dpr,4*dpr]);ctx.strokeRect(x0+1,y0+1,sz-2,sz-2);ctx.setLineDash([]);
   const n=st.name+(t.hidden?' (hidden)':'');ctx.font=`600 ${12*dpr}px 'Alegreya Sans',sans-serif`;const tw=ctx.measureText(n).width;
   if(!(S.drag&&S.drag.moved)){ctx.fillStyle='rgba(13,12,10,.9)';ctx.fillRect(cx-tw/2-5*dpr,y0+sz+3*dpr,tw+10*dpr,17*dpr);ctx.fillStyle='#E8DEC6';ctx.fillText(n,cx,y0+sz+12*dpr);}}
 }
 // pings
 S.pings=S.pings.filter(p=>now-p.t<2200);
 for(const p of S.pings){const k=(now-p.t)/2200;const cx=ox+(p.x+.5)*cs,cy=oy+(p.y+.5)*cs;ctx.strokeStyle=p.c||'#EBCB7A';ctx.globalAlpha=1-k;ctx.lineWidth=3*dpr;
  for(const o of[0,.33]){const kk=(k+o)%1;ctx.beginPath();ctx.arc(cx,cy,cs*(.3+kk*1.6),0,7);ctx.stroke();}ctx.globalAlpha=1;}
 if(S.pings.length||cur)draw();
}
function addPing(x,y,c){S.pings.push({x,y,c,t:performance.now()});draw();}

/* ---------- input ---------- */
const ptrs=new Map();let lpT=0;
const cellAt=(px,py)=>{const cs=CELL*S.view.s;return{x:Math.floor((px-S.view.x)/cs),y:Math.floor((py-S.view.y)/cs)};};
function hit(c){const l=Object.values(S.tokens).sort((p,q)=>(q.id===S.sel)-(p.id===S.sel)||(q.kind==='pc')-(p.kind==='pc'));
 return l.find(t=>c.x>=t.x&&c.x<t.x+(t.size||1)&&c.y>=t.y&&c.y<t.y+(t.size||1))||null;}
function myColor(){const t=S.role&&S.tokens['pc-'+S.role];return t?t.color:S.gm?'#B3262A':'#E8DEC6';}
function doPing(c){if(!S.meta||c.x<0||c.y<0||c.x>=S.meta.w||c.y>=S.meta.h)return;const col=myColor();addPing(c.x,c.y,col);send('ping',{x:c.x,y:c.y,c:col});}
function revertDrag(){const d=S.drag;S.drag=null;if(!d)return;const t=S.tokens[d.id];if(t&&d.moved){t.x=d.ox;t.y=d.oy;if(shown(t))send('drag',{id:t.id,x:t.x,y:t.y});}draw();}
function paintCell(c){const m=S.meta;if(!m||c.x<0||c.y<0||c.x>=m.w||c.y>=m.h)return;const i=c.y*m.w+c.x;if(m.cells[i]===S.brush)return;
 m.cells=m.cells.slice(0,i)+S.brush+m.cells.slice(i+1);terrainDirty();S.painted=true;draw();}
let dragSent=0;
cv.addEventListener('pointerdown',e=>{
 try{cv.setPointerCapture(e.pointerId);}catch(err){}ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
 if(ptrs.size===2){revertDrag();S.painting=false;S.press=null;clearTimeout(lpT);const[a,b]=[...ptrs.values()];
  S.pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:S.view.s,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,vx:S.view.x,vy:S.view.y};return;}
 if(ptrs.size>2)return;
 const c=cellAt(e.offsetX,e.offsetY);S.press={x:e.offsetX,y:e.offsetY,cell:c,moved:false};
 clearTimeout(lpT);lpT=setTimeout(()=>{if(S.press&&!S.press.moved&&ptrs.size===1){S.press.pinged=true;revertDrag();S.pan=null;doPing(c);}},550);
 if(S.mode==='paint'&&S.gm){S.painting=true;paintCell(c);return;}
 const t=hit(c);
 if(t&&canMove(t)){S.drag={id:t.id,ox:t.x,oy:t.y,x:t.x,y:t.y,gx:c.x-t.x,gy:c.y-t.y,moved:false};}
 else S.pan={x:e.offsetX,y:e.offsetY,vx:S.view.x,vy:S.view.y};
});
cv.addEventListener('pointermove',e=>{
 if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
 if(S.pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];const p=S.pinch;const ns=Math.max(.2,Math.min(4,p.s*Math.hypot(a.x-b.x,a.y-b.y)/p.d));
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;S.view.s=ns;S.view.x=mx-(p.mx-p.vx)*ns/p.s;S.view.y=my-(p.my-p.vy)*ns/p.s;draw();return;}
 const pr=S.press;if(pr&&!pr.moved&&Math.hypot(e.offsetX-pr.x,e.offsetY-pr.y)>6){pr.moved=true;clearTimeout(lpT);}
 if(S.painting){paintCell(cellAt(e.offsetX,e.offsetY));return;}
 if(S.drag&&pr&&pr.moved){const t=S.tokens[S.drag.id];if(!t){S.drag=null;return;}const c=cellAt(e.offsetX,e.offsetY),s=t.size||1;
  const x=Math.max(0,Math.min(S.meta.w-s,c.x-S.drag.gx)),y=Math.max(0,Math.min(S.meta.h-s,c.y-S.drag.gy));
  if(!S.drag.moved){S.drag.moved=true;S.sel=t.id;renderPanel();}
  if(x!==S.drag.x||y!==S.drag.y){S.drag.x=x;S.drag.y=y;t.x=x;t.y=y;const n=Date.now();if(n-dragSent>90&&shown(t)){dragSent=n;send('drag',{id:t.id,x,y});}draw();}return;}
 if(S.pan){S.view.x=S.pan.vx+e.offsetX-S.pan.x;S.view.y=S.pan.vy+e.offsetY-S.pan.y;draw();}
});
function endPtr(e){
 ptrs.delete(e.pointerId);clearTimeout(lpT);
 if(S.pinch){if(ptrs.size<2)S.pinch=null;S.pan=null;S.press=null;return;}
 if(S.painting){S.painting=false;if(S.painted){S.painted=false;saveMeta();}return;}
 const pr=S.press;S.press=null;S.pan=null;
 if(S.drag){const d=S.drag;const t=S.tokens[d.id];
  if(!d.moved||!t){S.drag=null;if(pr&&!pr.pinged){S.sel=d.id;changed();}return;}
  const ok=rangeFor(t,d.ox,d.oy)[d.y*S.meta.w+d.x]>=0&&!occupied(d.x,d.y,t.size||1,t.id);
  if((ok||S.gm&&walkable(S.meta,d.x,d.y,t.size||1)&&!occupied(d.x,d.y,t.size||1,t.id))&&(d.x!==d.ox||d.y!==d.oy)){S.drag=null;moveToken(t,d.x,d.y);}
  else{if(d.x!==d.ox||d.y!==d.oy)toast('Can\'t end there.');revertDrag();}
  return;}
 if(pr&&!pr.moved&&!pr.pinged){const t=hit(pr.cell);S.sel=t?t.id:null;if(t&&window.innerWidth<=760&&S.tab!=='token'){S.tab='token';}changed();}
}

function renderRole(){$('#gmLink').hidden=!S.gm;const sel=$('#role');const chars=Object.values(S.chars).sort((a,b)=>a.name.localeCompare(b.name));
 const html=`<option value="">Watching</option>${chars.map(c=>`<option value="${esc(c.id)}">Playing ${esc(c.name)}</option>`).join('')}<option value="gm">GM${S.gm?'':' (PIN)'}</option>`;
 if(sel.innerHTML!==html)sel.innerHTML=html;sel.value=S.role&&(S.role==='gm'||S.chars[S.role])?S.role:'';}
async function claimChar(id){const c=S.chars[id];const name=c?c.name:'this character';let claimed=false;
 try{claimed=((await rpc('char_claims',{p_party:S.code}))||[]).includes(id);}catch(e){}
 const pin=prompt(claimed?`Enter ${name}'s player PIN.`:`Set a player PIN for ${name} (4 or more characters). You'll only need it again on a new device.`);
 if(!pin)return false;if(pin.length<4){toast('PINs are 4 or more characters.');return false;}
 try{if(!await rpc('char_claim',{p_party:S.code,p_char:id,p_pin:pin})){toast('That PIN doesn\u2019t match.');return false;}}catch(e){toast(e.message||'Couldn\u2019t check the PIN.');return false;}
 lsSet('rtm.key.'+S.code+'.'+id,pin);return true;}
$('#role').onchange=async e=>{const v=e.target.value;
 if(v&&v!=='gm'&&!lsGet('rtm.key.'+S.code+'.'+v)&&!await claimChar(v)){e.target.value=S.role&&(S.role==='gm'||S.chars[S.role])?S.role:'';return;}
 S.role=v;lsSet('rtm.map.role.'+S.code,v);S.sel=null;if(window.RTMPolls)RTMPolls.check();
 if(v==='gm'){S.tab='gm';if(S.pin)loadMap();else{S.gm=false;changed();}}
 else{S.gm=false;if(S.tab==='gm')S.tab='turn';loadMap();}
 changed();};

 if(S.veiled)h+=`<p class="muted" style="margin:0">The GM hasn't revealed the map yet.</p>`;
 if(!S.meta&&!S.veiled)return`<p class="muted">${S.gm?'Make a map on the GM tab first.':'Waiting for the GM to set up a map.'}</p>${S.role?'':'<p class="muted">Pick your character at the top so you can move your token.</p>'}`;

  const order=I.order.filter(id=>S.tokens[id]);

 <div class="chips">${PRESETS.map(p=>`<button data-preset="${esc(p[0])}">${esc(p[0])}</button>`).join('')}</div>
 <div class="grid2"><label>Name<input id="nName" value="${esc((S.npc||{}).name||'Cultist')}"></label><label>How many<input id="nCount" type="number" min="1" max="20" value="${esc((S.npc||{}).count||1)}"></label>
 <label>HP<input id="nHp" type="number" value="${esc((S.npc||{}).hp||9)}"></label><label>AC<input id="nAc" type="number" value="${esc((S.npc||{}).ac||12)}"></label>
 <label>Speed (ft)<input id="nSp" type="number" step="5" value="${esc((S.npc||{}).speed||30)}"></label><label>Size<select id="nSize">${[1,2,3].map(v=>`<option value="${v}" ${((S.npc||{}).size||1)==v?'selected':''}>${['','1 square','2×2','3×3'][v]}</option>`).join('')}</select></label></div>
 <label class="ck"><input type="checkbox" id="nHid" ${(S.npc||{}).hidden?'checked':''}> Hidden until revealed</label>
 <button class="pri" data-act="addnpc">Add to the middle of the screen</button>
 <p class="muted" style="margin:0">Presets use the SRD 5.2 stat-swap picks (Cultist, Ghoul, Tough, Goblin Warrior, Animated Armor, Imp, Ogre, Gladiator). Double-check against your stat block.</p>
 <h3>Party</h3><button data-act="placeparty">Place every character from the party</button>
 <h3>Clear</h3><div class="row"><button class="bad" data-act="clearnpc">Remove all enemies</button><button class="bad" data-act="clearall">Remove all tokens</button></div>`:''}
 <p class="muted" style="margin:0">Party ${esc(S.code)} · Forgot the PIN? Ask Claude to reset it in the database.</p>`;
}
function readNpcForm(){S.npc={name:$('#nName').value.trim()||'Enemy',count:Math.max(1,Math.min(20,+$('#nCount').value||1)),hp:+$('#nHp').value||1,ac:+$('#nAc').value||10,speed:+$('#nSp').value||30,size:+$('#nSize').value||1,hidden:$('#nHid').checked};return S.npc;}
function viewCenterCell(){const r=$('#stage').getBoundingClientRect();return cellAt(r.width/2,r.height/2);}
$('#side').addEventListener('click',e=>{
 if(e.target.matches('input,select,label'))return;
 const b=e.target.closest('button,[data-pick]');if(!b)return;
 if(b.dataset.tab){S.tab=b.dataset.tab;S.min=false;renderPanel(true);return;}
 if(b.dataset.pick){S.sel=b.dataset.pick;const t=S.tokens[S.sel];if(t)centerOn(t);changed();return;}
 const t=S.sel&&S.tokens[S.sel];
 if(b.dataset.cond&&t){const c=new Set(t.cond||[]);c.has(b.dataset.cond)?c.delete(b.dataset.cond):c.add(b.dataset.cond);saveToken(Object.assign({},t,{cond:[...c]}));return;}
 if(b.dataset.color&&t){saveToken(Object.assign({},t,{color:b.dataset.color}));return;}
 if(b.dataset.brush!=null){S.brush=b.dataset.brush;renderPanel(true);return;}
 if(b.dataset.preset){const p=PRESETS.find(p=>p[0]===b.dataset.preset);const cnt=$('#nCount')?+$('#nCount').value||1:1;S.npc={name:p[0],hp:p[1],ac:p[2],speed:p[3],size:p[4],count:cnt,hidden:$('#nHid')&&$('#nHid').checked};renderPanel(true);return;}
 const I=S.meta&&(S.meta.init=S.meta.init||{on:false,order:[],turn:0,round:1});
 switch(b.dataset.act){
  case'min':S.min=!S.min;renderPanel(true);setTimeout(resize,0);break;
  case'center':if(t)centerOn(t);break;
  case'pin':{const v=$('#pin').value;if(v.length<4){toast('PIN needs 4 or more characters.');return;}claimGM(v);break;}
  case'reroll':S.gen={theme:$('#gTheme').value,size:$('#gSize').value,seed:String(1000+Math.floor(Math.random()*9000))};renderPanel(true);break;
  case'gen':{S.gen={theme:$('#gTheme').value,size:$('#gSize').value,seed:$('#gSeed').value.trim()||'1'};
   if(S.meta&&!confirm('Replace the current map for everyone? Tokens stay and get moved to open squares.'))return;
   const[w,h]=SIZES[S.gen.size];const m=generate(S.gen.theme,w,h,S.gen.seed);m.init=S.meta&&S.meta.init||{on:false,order:[],turn:0,round:1};m.live=false;
   S.meta=m;terrainDirty();S.fitted=true;fit();saveMeta(true);
   const toks=Object.values(S.tokens);const placed={};
   toks.forEach(tk=>{const s=tk.size||1;const anchor=tk.kind==='pc'?m.start:m.foe;
    const p=nearestWalk(m,anchor.x,anchor.y,s,(x,y,ss)=>Object.values(placed).some(o=>x<o.x+o.s&&x+ss>o.x&&y<o.y+o.s&&y+ss>o.y));
    if(p){placed[tk.id]={x:p.x,y:p.y,s};if(p.x!==tk.x||p.y!==tk.y)saveToken(Object.assign({},tk,{x:p.x,y:p.y}));}});
   changed();break;}
  case'reveal':setLive(true);break;
  case'veil':setLive(false);break;
  case'mode-move':S.mode='move';renderPanel(true);break;
  case'mode-paint':S.mode='paint';S.sel=null;renderPanel(true);draw();break;
  case'addnpc':{const n=readNpcForm();const c=viewCenterCell();const existing=Object.values(S.tokens).filter(x=>x.kind!=='pc'&&(x.name||'').replace(/\s*\d+$/,'')===n.name).length;
   const col=NPC_COLORS[hashStr(n.name)%NPC_COLORS.length];let k=0;
   for(let i=0;i<n.count;i++){const p=freeSpot(c.x,c.y,n.size);if(!p){toast('No room left on the map.');break;}
    const num=existing+i+1;const tk={id:'n-'+uid(),kind:'npc',name:(n.count>1||existing)?`${n.name} ${num}`:n.name,color:col,x:p.x,y:p.y,size:n.size,hp:n.hp,maxHp:n.hp,ac:n.ac,speed:n.speed,hidden:n.hidden,cond:[]};
    S.tokens[tk.id]=tk;saveToken(tk);k++;}
   if(k)toast(`Added ${k} ${n.name}${k>1?'s':''}${n.hidden?' (hidden)':''}.`);break;}
  case'placeparty':{let k=0;Object.values(S.chars).forEach(c=>{if(!S.tokens['pc-'+c.id]){const tk=pcToken(c);S.tokens[tk.id]=tk;saveToken(tk);k++;}});toast(k?`Placed ${k} character${k>1?'s':''}.`:'Everyone is already on the map.');break;}
  case'clearnpc':if(confirm('Remove every enemy token?'))Object.values(S.tokens).filter(x=>x.kind!=='pc').forEach(x=>delToken(x.id));break;
  case'clearall':if(confirm('Remove every token, including the party?'))delToken('*');break;
  case'dmg':case'heal':{if(!t)return;const v=+$('#dmg').value||0;if(!v)return;const max=+t.maxHp||0;let hp=(+t.hp||0)+(b.dataset.act==='dmg'?-v:v);if(max)hp=Math.min(max,hp);saveToken(Object.assign({},t,{hp:Math.max(0,hp)}));break;}
  case'dup':{if(!t)return;const p=freeSpot(t.x,t.y,t.size||1);if(!p)return;const base=(t.name||'Enemy').replace(/\s*\d+$/,'');const n=Object.values(S.tokens).filter(x=>(x.name||'').replace(/\s*\d+$/,'')===base).length+1;
   const tk=Object.assign({},t,{id:'n-'+uid(),x:p.x,y:p.y,hp:t.maxHp,name:`${base} ${n}`,label:'',cond:[]});S.tokens[tk.id]=tk;S.sel=tk.id;saveToken(tk);break;}
  case'del':if(t&&confirm(`Remove ${stats(t).name} from the map?`))delToken(t.id);break;
  case'startcombat':{const order=Object.values(S.tokens).sort((a,b)=>(+b.init||-99)-(+a.init||-99)||(a.kind==='pc'?-1:1)).map(x=>x.id);
   S.meta.init={on:true,order,turn:0,round:1};const wasHidden=S.meta.live===false;S.meta.live=true;saveMeta(true);if(wasHidden)send('reload',{});changed();const f=S.tokens[order[0]];if(f)centerOn(f);break;}
  case'sortinit':{I.order=Object.values(S.tokens).sort((a,b)=>(+b.init||-99)-(+a.init||-99)).map(x=>x.id);I.turn=0;saveMeta(true);changed();break;}
  case'next':case'prev':{const order=I.order.filter(id=>S.tokens[id]);if(!order.length)return;const curId=curTurnId();let i=Math.max(0,order.indexOf(curId));
   i+=b.dataset.act==='next'?1:-1;if(i>=order.length){i=0;I.round++;}if(i<0){i=order.length-1;I.round=Math.max(1,I.round-1);}
   I.order=order;I.turn=i;saveMeta(true);changed();const nt=S.tokens[order[i]];if(nt){S.sel=nt.id;centerOn(nt);}break;}
  case'endcombat':S.meta.init={on:false,order:[],turn:0,round:1};saveMeta(true);changed();break;
 }
});
$('#side').addEventListener('change',e=>{
 const el=e.target,t=S.sel&&S.tokens[S.sel];
 if(el.dataset.init){const tk=S.tokens[el.dataset.init];if(tk&&canEdit(tk))saveToken(Object.assign({},tk,{init:el.value===''?null:+el.value}));return;}
 if(el.dataset.f&&t){const f=el.dataset.f;let v=el.value;if(['hp','maxHp','ac','speed','size'].includes(f))v=v===''?null:+v;
  const nt=Object.assign({},t,{[f]:v});if(f==='size'&&!walkable(S.meta,t.x,t.y,v)){const p=freeSpot(t.x,t.y,v,t.id);if(p){nt.x=p.x;nt.y=p.y;}}saveToken(nt);return;}
 if(el.dataset.flag&&t){saveToken(Object.assign({},t,{[el.dataset.flag]:el.checked}));return;}
 if(el.id==='gTheme'||el.id==='gSize'||el.id==='gSeed'){S.gen={theme:$('#gTheme').value,size:$('#gSize').value,seed:$('#gSeed').value};}
});
$('#side').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin')$('[data-act=pin]').click();});

let toastT=0;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200);}

/* ---------- start ---------- */
(function init(){
 resize();renderPanel(true);renderRole();
 const hm=location.hash.match(/join-([A-Za-z0-9]{4}-?[A-Za-z0-9]{4})/);const q=new URLSearchParams(location.search).get('party');
 let code=normCode(hm?hm[1]:q||lsGet('rtm.party.code')||'');
 if(hm||q){try{history.replaceState(null,'',location.pathname);}catch(e){}}
 if(code.length===9)connect(code);
 else{$('#join').hidden=false;setStatus('off');}
 $('#joinBtn').onclick=()=>{const c=normCode($('#joinCode').value);if(c.length<9){toast('Party codes look like VOID-7K3Q.');return;}connect(c);};
 $('#joinCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('#joinBtn').click();});
})();
</script>
<script src="polls.js"></script>
